<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nishant Singh — Projects for Backend Engineer roles</title>
<style>
/* Layout idea: Apple TV. A cinematic spotlight with a 3D cascade of top projects, then horizontally scrolling shelves, then a full grid. */
:root{
  --bg:#eef0f5; --bg2:#e2e6ee; --surface:rgba(255,255,255,.74); --solid:#ffffff;
  --ink:#0d1220; --ink2:#4b556b; --line:rgba(13,18,32,.12);
  --accent:#ea4324; --accent2:#0a9d92; --shadow:0 18px 50px -18px rgba(20,28,50,.35);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --gut:clamp(16px,4vw,56px);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#06080d; --bg2:#0e121b; --surface:rgba(255,255,255,.065); --solid:#121723;
  --ink:#f3f5fa; --ink2:#9da6ba; --line:rgba(255,255,255,.13);
  --accent:#ff7350; --accent2:#35e0cf; --shadow:0 24px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .6s,color .6s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.022em;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.bar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px var(--gut);
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 82%,transparent),transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.clock{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);padding:5px 8px 5px 6px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.clock svg{width:14px;height:14px;color:var(--accent);transition:transform .8s cubic-bezier(.3,1.6,.4,1)}
.clock:hover svg{transform:rotate(40deg)}
.clock em{font-style:normal;opacity:.7;font-weight:500}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--ink2);font-weight:500}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs a{font-size:13px;font-weight:500;color:var(--ink2);padding:6px 12px;border-radius:99px;transition:.25s}
.tabs a:hover{color:var(--ink);background:var(--surface)}
.search{margin-left:auto;position:relative;flex:0 1 340px;min-width:140px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 34px 9px 36px;transition:.3s}
.search input::placeholder{color:var(--ink2)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink2);pointer-events:none}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--line);display:none;font-size:14px;line-height:22px}
.search.has kbd{display:none}.search.has .x{display:block}

/* ---------- spotlight ---------- */
.hero{position:relative;height:clamp(560px,82vh,760px);overflow:hidden;isolation:isolate}
.backdrop{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.35);opacity:0;transition:opacity 1.2s;z-index:-3}
.backdrop.on{opacity:.9}
:root:not([data-mode="dark"]) .backdrop.on{opacity:.62}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(to right,color-mix(in srgb,var(--bg) 88%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 42%,transparent 75%),
  linear-gradient(to top,var(--bg) 0%,transparent 34%)}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:120px;z-index:-1;color:var(--bg)}
.waves path{fill:currentColor}
.waves .w1{opacity:.35;animation:drift 16s ease-in-out infinite alternate}
.waves .w2{opacity:.6;animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(-4%)}}
.hero-in{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:24px;padding:84px var(--gut) 96px}
.copy{max-width:560px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.eyebrow i{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
.copy h1{font-size:clamp(40px,6.2vw,84px);line-height:.98;font-weight:800;margin:14px 0 16px;letter-spacing:-.04em}
.copy p{font-size:clamp(16px,1.5vw,20px);color:var(--ink2);margin:0 0 20px;max-width:46ch}
.swap>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.swap>*:nth-child(2){animation-delay:.06s}.swap>*:nth-child(3){animation-delay:.12s}.swap>*:nth-child(4){animation-delay:.18s}.swap>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{transform:translateY(18px);filter:blur(6px);opacity:.01}to{transform:none;filter:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 20px;border-radius:14px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s,background .25s}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(10px)}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}

.stage{position:relative;height:min(46vw,420px);perspective:1500px;perspective-origin:30% 50%}
.s-card{position:absolute;left:0;top:50%;width:min(62%,560px);aspect-ratio:16/9;margin-top:calc(min(62%,560px)*-0.28);border-radius:22px;overflow:hidden;
  transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.85,.2,1),opacity 1s,filter 1s;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);will-change:transform;background:#111 center/cover;cursor:pointer}
.s-card{background-position:top center}.s-card::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 40%)}.s-card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 30%)}
.s-card b{position:absolute;left:18px;bottom:14px;right:18px;color:#fff;font:800 clamp(18px,2.4vw,30px)/1.05 var(--display);letter-spacing:-.03em;text-shadow:0 2px 18px rgba(0,0,0,.6);z-index:1}
.s-card .out{position:absolute;top:12px;right:12px;z-index:2;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:6px 10px;border-radius:99px;opacity:0;transition:.3s}
.s-card.act .out{opacity:1}
.s-card .out svg{width:12px;height:12px}
.pager{position:absolute;left:var(--gut);bottom:44px;display:flex;gap:6px;align-items:center;z-index:3}
.pager button{width:8px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;transition:width .5s;position:relative}
.pager button.on{width:44px}
.pager button.on::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:fill var(--dur,7s) linear forwards}
.hero.paused .pager button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nav-arrow{position:absolute;bottom:34px;right:var(--gut);display:flex;gap:8px;z-index:3}
.round{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px);transition:.25s}
.round:hover{background:var(--ink);color:var(--bg);transform:scale(1.08)}
.round svg{width:16px;height:16px}

/* ---------- shelves ---------- */
main{position:relative;padding-bottom:80px;overflow-x:clip}
.blob{position:absolute;width:60vw;height:60vw;max-width:800px;max-height:800px;border-radius:50%;filter:blur(110px);opacity:.16;pointer-events:none;z-index:-1}
.blob.a{background:var(--accent);left:-20vw;top:300px}.blob.b{background:var(--accent2);right:-22vw;top:1400px}
.group-h{padding:44px var(--gut) 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.group-h h2{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.035em}
.group-h p{margin:0;color:var(--ink2);font-size:15px}
.shelf{padding-top:26px;position:relative}
.shelf-h{display:flex;align-items:center;gap:10px;padding:0 var(--gut);margin-bottom:10px}
.shelf-h h3{font-size:19px;font-weight:700}
.shelf-h span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.shelf-h .sp{margin-left:auto;display:flex;gap:6px}
.shelf-h .round{width:30px;height:30px}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px var(--gut) 22px;scrollbar-width:none;scroll-padding-left:var(--gut)}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 clamp(240px,23vw,330px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px;padding:18px var(--gut) 0}

.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.poster{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--bg2) center/cover;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:0 10px 26px -14px rgba(0,0,0,.5)}
.card:hover .poster,.poster:focus-visible{--sc:1.045;box-shadow:0 30px 50px -22px rgba(0,0,0,.65),0 0 0 3px color-mix(in srgb,var(--ink) 85%,transparent)}
.poster{background-position:top center}.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,0) 46%)}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover .poster::after{opacity:1}
.poster b{position:absolute;left:14px;right:14px;bottom:11px;color:#fff;font:800 21px/1.05 var(--display);letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.poster small{position:absolute;left:14px;top:12px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.36);backdrop-filter:blur(6px);padding:3px 8px;border-radius:99px}
.poster .go{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;transform:scale(0) rotate(-45deg);transition:transform .35s cubic-bezier(.3,1.6,.4,1)}
.poster .go svg{width:13px;height:13px}
.card:hover .go{transform:none}
.meta{text-align:left;display:block;width:100%;padding:0 4px;border-radius:10px}
.meta p{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.meta span svg{width:11px;height:11px;transition:transform .25s}
.meta:hover span{color:var(--accent)}.meta:hover span svg{transform:translateX(4px)}
.why{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px}
.why i{font-style:normal;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:8px;padding:16px var(--gut) 0}
.filters button{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);transition:.25s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button em{font-style:normal;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

#results{display:none;padding-top:96px;min-height:70vh}
body.searching #results{display:block}
body.searching .hero,body.searching #browse{display:none}
.res-h{padding:0 var(--gut)}
.res-h h2{font-size:clamp(24px,3vw,36px);font-weight:800}
.res-h p{color:var(--ink2);margin:6px 0 0}
.try{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.try button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.try button:hover{border-color:var(--accent);color:var(--accent)}

.reveal{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.pre{transform:translateY(26px)}
footer{padding:40px var(--gut);color:var(--ink2);font-size:13px;border-top:1px solid var(--line);margin-top:60px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer a{text-decoration:underline;text-underline-offset:3px}

/* ---------- detail ---------- */
#detail{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain}
#detail.open{display:block;animation:sheet .55s cubic-bezier(.2,.85,.2,1)}
@keyframes sheet{from{transform:translateY(40px) scale(.985);opacity:.4}to{transform:none;opacity:1}}
.d-hero{position:relative;min-height:440px;display:flex;align-items:flex-end;padding:110px var(--gut) 40px;isolation:isolate;overflow:hidden}
.d-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;animation:ken 24s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,1%)}}
.d-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--bg) 2%,color-mix(in srgb,var(--bg) 62%,transparent) 48%,rgba(0,0,0,.18))}
.d-close{position:fixed;top:14px;right:var(--gut);z-index:90}
.d-back{position:fixed;top:14px;left:var(--gut);z-index:90;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 14px 9px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px)}
.d-back svg{width:14px;height:14px}
.d-title{max-width:900px}
.d-title h1{font-size:clamp(40px,7vw,92px);line-height:.96;font-weight:800;letter-spacing:-.045em;margin:10px 0 14px}
.d-title p{font-size:clamp(17px,1.8vw,22px);color:var(--ink2);margin:0;max-width:52ch}
.d-body{padding:0 var(--gut) 80px;max-width:1440px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:6px 0 34px}
.facts>div{background:var(--bg);padding:14px 16px;min-width:0}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.facts dd{margin:4px 0 0;font:700 20px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts dd small{font:500 12px var(--body);color:var(--ink2);letter-spacing:0}
.langbar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;gap:2px}
.langbar i{display:block;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--ink2)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.d-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.d-title{min-width:0}#detail{overflow-x:hidden}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 24px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:15px;height:15px}
.panel>p{margin:0;font-size:16.5px;line-height:1.6;max-width:70ch}
.panel.hl{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface))}
.panel.hl2{background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 16%,var(--surface)),var(--surface))}
.flow{display:flex;flex-wrap:wrap;gap:10px 0;align-items:stretch;counter-reset:n}.step{display:flex;align-items:stretch;min-width:0}
.node{position:relative;counter-increment:n;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 40px;font-size:14px;font-weight:600;line-height:1.3;max-width:260px;display:flex;align-items:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*70ms)}
.node::before{content:counter(n);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 11px/22px var(--mono);text-align:center}
@keyframes pop{from{transform:scale(.8);opacity:.01}to{transform:none;opacity:1}}
.link{flex:none;width:36px;margin:0 4px;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);background-size:24px 2px;animation:dash 1s linear infinite;position:relative}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--accent)}
@keyframes dash{to{background-position:24px 0}}
pre{font:13px/1.55 var(--mono);background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto;margin:0;white-space:pre;tab-size:2}
.tree .d{color:var(--accent2);font-weight:600}.tree .c{color:var(--ink2)}
.md{font-size:15.5px;line-height:1.65;max-width:78ch}
.md h3{font-size:21px;margin:26px 0 8px}.md h4{font-size:16px;margin:18px 0 6px}
.md p{margin:0 0 12px}.md ul,.md ol{margin:0 0 12px;padding-left:22px}.md li{margin:3px 0}
.md code{font:13px var(--mono);background:var(--solid);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.md pre{margin:0 0 14px}.md pre code{border:0;padding:0;background:none}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.md blockquote{margin:0 0 12px;padding:4px 14px;border-left:3px solid var(--accent2);color:var(--ink2)}
.tw{overflow-x:auto;margin:0 0 14px}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--solid);font-weight:700}
.more-h{font-size:22px;font-weight:800;margin:40px 0 4px}

@media (max-width:900px){
  .tabs{display:none}.brand span{display:none}
  .hero{height:auto}
  .hero-in{grid-template-columns:1fr;padding:92px var(--gut) 96px;gap:30px}
  .stage{height:56vw;order:-1}
  .s-card{width:78%;margin-top:calc(78vw*-0.2)}
  .d-grid{grid-template-columns:1fr}
  .link{width:22px}
}
@media (max-width:520px){.search kbd{display:none}.clock em{display:none}.grid{grid-template-columns:1fr 1fr;gap:16px 10px}.poster b{font-size:16px}.node{max-width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

/* ---------- opening: a point of light arrives from far away, becomes the mark, then passes through ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;overflow:hidden;perspective:900px;animation:introOut .55s 2.6s forwards;cursor:pointer}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,#ffd9cc 28%,rgba(255,115,80,.5) 55%,transparent 75%);opacity:0;animation:flash 3s forwards;pointer-events:none}
.i-core{position:relative;width:min(62vmin,540px);aspect-ratio:1;display:grid;place-items:center;transform-style:preserve-3d;animation:approach 3s cubic-bezier(.55,0,.25,1) forwards}
.i-core>*{grid-area:1/1}
.i-glow{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,150,110,.75) 9%,rgba(255,115,80,.32) 26%,rgba(53,224,207,.16) 46%,transparent 66%);animation:breathe 1s ease-in-out infinite alternate}
.i-rays{width:150%;height:150%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0deg 2deg,transparent 2deg 15deg,rgba(53,224,207,.16) 15deg 16deg,transparent 16deg 30deg);-webkit-mask:radial-gradient(circle,transparent 16%,#000 30%,transparent 68%);mask:radial-gradient(circle,transparent 16%,#000 30%,transparent 68%);animation:spin 6s linear infinite;filter:blur(1.5px)}
.i-ring{width:74%;height:74%;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 40px rgba(255,115,80,.8),inset 0 0 40px rgba(53,224,207,.5);animation:spin 9s linear infinite reverse;border-top-color:transparent;border-bottom-color:transparent}
.i-mark{font:800 clamp(64px,19vmin,170px)/1 var(--display);letter-spacing:-.07em;color:#fff;text-shadow:0 0 30px #fff,0 0 80px #ff7350,0 0 140px #ff7350;animation:markIn 3s forwards}
.i-sub{align-self:end;margin-bottom:12%;font:700 clamp(9px,1.7vmin,14px) var(--display);letter-spacing:.5em;text-indent:.5em;color:#fff;text-transform:uppercase;white-space:nowrap;animation:subIn 3s forwards}
@keyframes approach{0%{transform:translateZ(-12000px) scale(.25)}58%{transform:translateZ(0) scale(1)}76%{transform:translateZ(40px) scale(1.03)}100%{transform:translateZ(860px) scale(4)}}
@keyframes markIn{0%,30%{opacity:0;filter:blur(14px)}58%,80%{opacity:1;filter:none}100%{opacity:0}}
@keyframes subIn{0%,50%{opacity:0;letter-spacing:1.4em}66%,80%{opacity:.9;letter-spacing:.5em}100%{opacity:0}}
@keyframes breathe{to{transform:scale(1.12)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%,78%{opacity:0}92%{opacity:1}100%{opacity:.0}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

/* ---------- tailored view bar ---------- */
.viewbar{padding:22px var(--gut) 0}
.vb-row{display:flex;align-items:center;gap:12px;min-width:0}
.vb-l{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.vb-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0;margin-right:calc(var(--gut)*-1);padding-right:var(--gut);min-width:0}
.vb-chips::-webkit-scrollbar{display:none}
.vb-chips button{flex:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);transition:.25s}
.vb-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.vb-note{margin:12px 0 0;font-size:14.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.vb-note strong{color:var(--ink)}
.vb-note button{font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-all;text-align:left}
@media (hover:none){.poster .go{transform:none}.shelf-h .sp{display:none}.card:hover .poster{--sc:1}}
@media (max-width:900px){
  .bar{gap:10px;padding:8px var(--gut);background:color-mix(in srgb,var(--bg) 86%,transparent)}
  .search{flex:1 1 auto;min-width:0}
  .hero-in{padding:76px var(--gut) 84px;gap:22px}
  .stage{height:auto;aspect-ratio:16/10.5;max-height:46vh;width:100%}
  .s-card{width:80%;top:6%;margin-top:0;border-radius:16px}
  .copy h1{font-size:clamp(36px,11vw,60px);margin:10px 0 12px}
  .copy p{margin-bottom:14px}
  .pager{bottom:36px}.nav-arrow{bottom:26px}
  .row{gap:12px;padding-bottom:16px}
  .row .card{flex-basis:min(74vw,320px)}
  .group-h{padding-top:34px}
  .d-hero{min-height:0;padding:150px var(--gut) 26px}
  .d-title h1{font-size:clamp(36px,11vw,64px)}
  .d-hero::after{background:linear-gradient(to top,var(--bg) 10%,color-mix(in srgb,var(--bg) 90%,transparent) 58%,rgba(0,0,0,.1))}
  .d-body{padding-bottom:56px}
  .panel{padding:18px;border-radius:18px}
  .panel>p{font-size:15.5px}
  .facts{grid-template-columns:1fr 1fr}
  .facts dd{font-size:18px}
  .flow{flex-direction:column;gap:0}
  .step{flex-direction:column;align-items:stretch}
  .node{max-width:none}
  .link{width:2px;height:16px;margin:0 0 0 20px;background:repeating-linear-gradient(180deg,var(--accent) 0 5px,transparent 5px 10px);animation:none}
  .link::after{right:-4px;top:auto;bottom:-6px;border:5px solid transparent;border-top-color:var(--accent);border-left-color:transparent}
  pre{font-size:12px;padding:12px}
  .md{font-size:15px}.md h3{font-size:19px}
  .d-back{top:10px}
  footer{flex-direction:column;margin-top:40px;padding:28px var(--gut)}
}
@media (max-width:520px){
  .brand{display:none}
  .search input{font-size:16px;padding:8px 12px 8px 34px}
  .pager button{width:6px;height:6px}.pager button.on{width:30px}.pager{gap:5px}
  .chips .chip{font-size:11.5px}
  .actions .btn{flex:1 1 auto;justify-content:center;padding:12px 14px}
  .grid{padding-top:14px}
  .grid .poster small{display:none}
  .grid .poster b{font-size:14.5px;left:10px;right:10px;bottom:8px}
  .grid .poster{border-radius:12px}
  .grid .meta p{font-size:12.5px}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.filters button{flex:none}
  .shelf-h h3{font-size:17px}
  .res-h h2{font-size:22px}
  #results{padding-top:76px}
  .vb-row{flex-direction:column;align-items:flex-start;gap:6px}.vb-chips{max-width:calc(100% + var(--gut))}
}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
</style>

<script id="data" type="application/json">{"projects":[{"id":"tessera","n":"Tessera","r":"Tessera","top":1,"col":["#7c83ff","#111827"],"live":"https://tessera-nishant.netlify.app","t":"A working zero-trust access gateway: every request verified, then allowed, challenged or denied.","c":["sys"],"k":"Security gateway","s":["TypeScript","React 18","Vite","Netlify Functions","Netlify Blobs","WebAuthn","TOTP","PBKDF2","AES-256-GCM"],"kw":["security","cybersecurity","zero trust","authentication","auth","login","passkeys","webauthn","2fa","two factor","access control","rbac","policy engine","audit log","encryption","identity","iam","access management system","gateway","full stack"],"what":"Brokers every request to every app through one guarded gate. On each request it checks who you are, your device and network, where you are going and how sensitive it is, then allows, steps up or blocks.","how":"One Netlify Function is the only path to any resource. It runs real authentication (PBKDF2-SHA-256 at 210k iterations, RFC 6238 TOTP, WebAuthn passkeys), a default-deny policy engine over seven signals, resource classification with field redaction, just-in-time grants and East-West segmentation.","special":"Sandbox personas let you feel the model: open payroll as a vendor (denied) then as finance (allowed), or flip your device to unmanaged and watch an allow turn into a challenge.","diff":"The audit trail is encrypted at rest with AES-256-GCM and linked as a SHA-256 hash chain, so tampering with one record breaks every record after it.","arch":["Browser (React)","/api/* single gate (Netlify Function)","Auth: PBKDF2 · TOTP · passkeys","Policy engine: 7 signals, default deny","Resources: classification + redaction","JIT grants · segmentation","Audit: AES-GCM + hash chain","Netlify Blobs"],"img":"data:image/webp;base64,UklGRhpTAABXRUJQVlA4IA5TAACwgQGdASrAAxwCPp1KoU0lpCMiovM5ULATiWlu8nYzT//xQV/g8P0qiWu6GLzB/R8eB830h8230689d6Md4o9ADzqfWI/12TA+c/7/+Ufmc/V/8X/e/xu9Mfxr6N/Mf3L/H/871aspfXL 4slTSUogF0xQS7HmX1SyyJgEPs3B1JwBb6MAXM+44fdMKdAx9xs0OtEPmLe1XlLvJqmA+GxlCGGMX1MHfKZUTKKq7PUZpF9e2kBZdHjYkbfYpv8qruBWsRp43mHSq1tR+DCdJrcbad3gs3t7k3bFYEVcYUHauQrpkie6AAQTGDVrzSG0BvRwRAAAAAAAAAAAAAAAAAAAAAAAAAAAA","files":51,"loc":4233,"langs":[["TypeScript",3287],["CSS",801],["JavaScript",121],["HTML",24]],"tree":"docs/\n  2fa.png\n  audit.png\n  decision-allow.png\n  learn.png\n  mobile-signin.png\n  overview.png\n  segmentation.png\n  signin.png\n  workspace.png\nnetlify/\n  functions/\n    api.mts\n    cleanup.mts\n  lib/\n    aead.ts\n    crypto.ts\n    data.ts\n    http.ts\n    passkeys.ts\n    store.ts\n    totp.ts\npublic/  (1 files)\nscripts/\n  devserver.mjs\n  shoot.mjs\nshared/\n  policy.ts\n  seed.ts\n  segmentation.ts\n  types.ts\nsrc/  (16 files)\ntests/\n  assert.ts\n  e2e.ts\n  run.ts\nindex.html\nnetlify.toml\npackage-lock.json\npackage.json\nREADME.md\ntsconfig.json\nvite.config.ts","date":"2026-10-10","readme":"# Tessera\n\n**A working zero-trust access gateway.** Tessera brokers every request to every app through a single guarded gate. On each request it verifies who you are, the device and network you're on, where you're going and how sensitive it is, then **allows, challenges (step-up), or denies** — and writes the decision to a tamper-evident log. It's a live demo you can sign into as five different people and watch least-privilege access enforced in real time.\n\n**Live:** https://tessera-nishant.netlify.app &nbsp;·&nbsp; **Author:** [Nishant Singh](https://nishant-singhaa0240274.netlify.app)\n\n## The idea\n\nOld security trusted anything inside the network perimeter. Zero trust removes the perimeter: **never trust, always verify** — every request is authenticated, authorised and inspected, no matter where it comes from. Tessera is that model as running code, built around the **seven elements of a zero-trust architecture**:\n\n1. **Verify identity** — who is connecting\n2. **Assess access context** — the device posture and network\n3. **Identify destination** — the resource and its classification\n4. **Assess risk** — an adaptive score from the live signals\n5. **Prevent compromise** — hard device rules and step-up re-verification\n6. **Prevent data loss** — clearance vs classification, with field-level redaction\n7. **Enforce policy** — a default-deny, least-privilege verdict\n\n## Try it\n\nSign in as any sandbox persona (the 2FA code auto-fills for the demo). Shared password: `Sandbox#2026`.\n\n| Persona | Role | Clearance | What they can reach |\n|---|---|---|---|\n| Nishant Singh | Security admin | Restricted | Everything, plus the admin console and audit trail |\n| Rohan Desai | Finance | Restricted | Payroll in full — on a managed device |\n| Priya Menon | People / HR | Confidential | Benefits and names, but **not** bank details |\n| Meera Iyer | Engineering | Internal | The wiki; blocked from finance and HR |\n| Arjun Rao | External vendor | Public | Only the public handbook |\n\n**Things to try:** open the payroll register as the vendor (denied), then as finance (allowed). In the workspace, flip your device to *unmanaged* and watch a clean allow turn into a step-up or a block. Request just-in-time access to something you're denied, approve it as the admin, and reach it under a time-boxed grant.\n\n## Features\n\n- **Real authentication** — passwords hashed with PBKDF2-SHA-256 (210k iterations), RFC 6238 TOTP two-factor, and **WebAuthn passkeys** for phishing-resistant sign-in.\n- **The seven-element policy engine** — pure, unit-tested decision logic returning allow / step-up / deny with a reason for every element.\n- **Least privilege + data-loss prevention** — resources carry a classification and department scope; fields above your clearance are **redacted, not returned**; restricted data demands a managed device.\n- **Adaptive step-up** — elevated risk or weak auth triggers re-verification; a managed-device rule or insufficient clearance can't be stepped past.\n- **Just-in-time access** — request elevation, an admin grants it, and it **expires on its own** (15 minutes).\n- **East-West microsegmentation** — a default-deny matrix of which workloads may talk to which, so a foothold can't pivot.\n- **Tamper-evident audit** — every decision is **hash-chained** to the last; an integrity check recomputes the chain and pinpoints any alteration.\n- **Encryption at rest** — TOTP seeds sealed with AES-256-GCM.\n- **Brute-force protection** — failed-login lockout with escalating backoff.\n- **Compliance posture** — resources mapped to NIST CSF, SOC 2, HIPAA, PCI-DSS and GDPR.\n- **Hardened delivery** — strict Content-Security-Policy and security headers.\n\n## Architecture\n\n```\nBrowser (React) ──▶ /api/*  (the gate — one Netlify Function)\n                      │\n                      ├─ auth: PBKDF2 password · TOTP · WebAuthn passkeys\n                      ├─ policy engine: the 7 elements, default-deny\n                      ├─ resources: classification, scope, field redaction\n                      ├─ JIT grants · East-West segmentation\n                      └─ audit: AES-256-GCM at rest · SHA-256 hash chain\n                      │\n                   Netlify Blobs  (users, sessions, audit, grants, passkeys)\n```\n\nEverything enters through one function. There is no other path to a resource — the single brokered gate is the whole point.\n\n### API\n\n| Method | Path | Purpose |\n|---|---|---|\n| POST | `/api/login` · `/api/verify` | Password step, then TOTP; issues a signed, HttpOnly session |\n| POST | `/api/passkey/*` | WebAuthn registration and authentication |\n| GET | `/api/resources` | The catalogue the signed-in user may see |\n| POST | `/api/access` · `/api/stepup` | Run the policy engine; return the record or a step-up |\n| GET | `/api/segmentation` | Workloads and the allowed-flow matrix |\n| GET/POST | `/api/requests` · `/api/requests/decide` | Just-in-time access requests and approvals |\n| GET/POST/DELETE | `/api/users` | Admin: manage sandbox users |\n| GET | `/api/audit` · `/api/audit/verify` | The hash-chained log and its integrity check |\n\n## Tech stack\n\nTypeScript everywhere · React 18 + Vite · Netlify Functions (Node 22) · Netlify Blobs · `@simplewebauthn` · Node `crypto` (PBKDF2, AES-256-GCM, HMAC) · hand-built SVG · GitHub Actions. No UI framework — the design system is hand-written.\n\n## What it demonstrates\n\nTessera puts these certifications into running code:\n\n- **Zscaler** — the seven elements (Mastering the Fundamentals of Zero Trust, ZTCA); the gateway/exchange model, multi-cloud workload tagging and East-West segmentation (Zero Trust Cloud, EDU-240); clearance-based DLP (Data Security / Endpoint DLP, EDU-220/222); the audit trail (Security Operations, EDU-250); secure protocols (Networking for Cyber Professionals, EDU-101); policy administration (Administrator, EDU-200).\n- **Google Cloud Cybersecurity Certificate** — AAA: authentication, authorization, auditing (course 3); the security lifecycle and least privilege (course 1); compliance frameworks (course 2); logging and alert monitoring (course 4).\n- **Fortinet FCF** — access control and secure network architecture.\n\nIt also goes past the courses: passkeys, a hash-chained audit log, AES-256-GCM at rest, brute-force lockout, just-in-time access and a strict CSP.\n\n> **A deliberate boundary.** Tessera only builds the defences. It does not simulate attacks, run intrusions, or set traps — the strength is shown by the gate holding and refusing the wrong request, not by attacking it.\n\n## Run it\n\n```bash\nnpm install\nnpm run build\nnpx netlify dev          # http://localhost:8888\n```\n\nNo configuration is required to run. Optional environment variables:\n\n| Variable | Required | What it does |\n|---|---|---|\n| `TESSERA_KEY` | No | Server key for encryption at rest. A development default is used if unset — **set it in production.** |\n\n## Tests\n\n```bash\nnpm test          # 51 unit checks + 20 end-to-end checks\nnpm run typecheck # strict TypeScript\n```\n\n- **Unit** (`tests/run.ts`): the policy engine (least privilege, DLP, step-up, redaction, JIT), PBKDF2 round-trips, **RFC 6238 TOTP test vectors**, segmentation default-deny, AES-256-GCM encryption with tamper detection, and the audit hash chain (including detecting a tampered entry).\n- **End-to-end** (`tests/e2e.ts`): drives the real gateway function — sign-in with 2FA, brute-force lockout, allow/deny decisions, step-up, just-in-time grants, and audit-chain verification.\n\nCI runs typecheck, tests and build on every push (`.github/workflows/ci.yml`).\n\n## Deploy on Netlify\n\nBuild command `npm run build`, publish directory `dist`. The functions in `netlify/functions/` and Blobs storage are picked up automatically. Set `TESSERA_KEY` under Site settings → Environment variables.\n\n## License\n\nMIT © 2026 Nishant Singh. A demonstration project; the sandbox data is fictional."},{"id":"parley","n":"Parley","r":"Parley","top":2,"col":["#22c55e","#064e3b"],"live":"https://parley-nishant.netlify.app","t":"Real-time chat with rooms, DMs and groups, and a Gemini co-pilot you can @mention.","c":["sys","ai"],"k":"Real-time chat app","s":["React 18","Vite","Netlify Edge Functions (Deno)","Server-Sent Events","Netlify Functions","Netlify Blobs","JWT","Gemini API","Framer Motion"],"kw":["chat","messaging","messenger","real-time","realtime","sse","websocket alternative","rooms","direct messages","group chat","typing indicator","read receipts","reactions","file sharing","ai assistant","chatbot","copilot","translation","summarization","social","full stack"],"what":"Public rooms, one-to-one DMs and group chats with live typing indicators, presence, unread badges, read receipts, reactions, replies, edits and image or file sharing.","how":"A React UI with an optimistic store sends REST calls with JWT to a Netlify Function, while a Deno edge function streams Server-Sent Events to every client, with a polling fallback. All state lives in Netlify Blobs.","special":"Mention @gemini in any message and it replies in-thread using recent context. It also offers smart replies, a catch-me-up summary and English ⇄ Hindi translation.","diff":"Real-time on a fully serverless stack with no WebSocket server: messages usually arrive in under a second through an SSE edge stream, and your own messages appear instantly then reconcile with the server copy.","arch":["React UI + optimistic store","REST + JWT → Netlify Function","EventSource ← Edge function (SSE)","Netlify Blobs: users, chats, messages, inboxes","Gemini API"],"img":"data:image/webp;base64,UklGRnhQAABXRUJQVlA4IGxQAACwhwGdASrAAxwCPp1MoU0lpCclopCpUOATiWdu/CX1knSxmNYob9k/v/AA0pwtcGPkIdKbtPNH6oM53/V9an6k9gPzF/9717+Yz9ovV09J/9h9QD+4/6TrQvQA8vD2cf8Bky3nH/H/k/73vjH7H/k/7l+3n969Rfxz6P/Jf33z4so/pP9R/2v8d6nfzD7/fw/8X52/8D+5+KP5V+8/9j/AewL+S/0D/Y/3/2C/qex41X/i+gL69fX/ID9n/5X98/xfsb+f/4j/gf4v4Af5N/Z/+L/gvaT/P/+H/CeSZ9z/2P7S/AF/K/7d/1P8f/rv3a+l/+t/bP/Y+mv86/2n7afAT/Pv7/6eftD9KEWqGatL/DvXTZRG0VjYYYpIMUkGKSDFJBikgxSQYpISrUr5AEVQvcU6zmvo9e4SzmRyiCRABTMZOyDFJBik72KzHQIwc86wwymYydiMIwMjvVtGQVn5dX18XXYXI7GBiPkyKCeiNkGox/cKVMIGFEqkcsAROXYQ9d56fesqWQu1WHUw+EZNOyDFOOg3AdT6yTYetHCuhXExihzCIV7dosqWNhhisDNwZAO79lAcd56fespd977nI9b1b5GWTHMyM062ND0PDMS7O7EqCBo4EOtjjkAjFr03PGxmrN1LAePFjYYYpQzBesd5aXui8eLGwwxQ4lCLQfq+41gbJexIVGDq1/vlqpSxxX1q2ItKtpTGC9pkhVmrbYgXm/2Enbi8poOwZWeke9wi22uQ0RkAdJXOKE3ObtxdGBoxXP4q7OGbIvYIJ95W8QOy8KQAr/2fGSEFC1W1vfdBh8DHTfVKF/vlLQSkNDM8i+dVpJfcwPzxquhx3np97OJ9dSloD4QwxSQYpIMUJycsg2ooNzs+aorPj2tb0Uhp9XYs0sN+rSvBXsL9bN/dY9MhuyOe78RVs+bR0vfHYGz4sV7ELuG+0HPtHehd6U7Ov8Ac5028jd710Vw6LO1DjRAR3NWo5GxaF4XQNX/P+uCUw3tDhib0Em+TthdaCvdSepwrNopnZBikW8QPXUpauFs4OO89PvWVLQxJ0zN020kDdEQI2+MnUYZDMpbgl/ojm6cUkGKwP3tVbd0ux9sgxSQYpH614699tG2VSMi9+lW3wSLzO6TZ9K4Ih8Ffd2cbOdxbOGNHO5i7OiLQ55fwfCI/p2QYopkzMLtwQ6sr3D///8aCkDaCvsrGwwsWFowAHyV10SVtHGIKtDNLRTQToL3qqCp7aL/J846Z2yIEbsqDLXtUcuKn0JgSvzLJP9bMZOyA7ETrNZkog/HZVmoEV1HUQTVO/JNcMUkGKSDFlM8OdSP2dLeJ707vSpZ8PzQjcsuzPuNVJ4BamYCBz0cfR6naH Mxxdo5scUEQb4Ep3U5tWmZ2q/UTKFRQWRIChHmCEOfcaTJDQQso5gBSf9Nfd6EDuf11VkyouTyixCAAAA==","files":39,"loc":3115,"langs":[["JavaScript",2738],["CSS",253],["Python",101],["HTML",23]],"tree":"docs/\n  dm.jpg\n  landing.jpg\n  mobile.jpg\n  room.jpg\nnetlify/\n  edge-functions/\n    live.js\n  functions/\n    api.mjs\n    live-node.mjs\n  lib/\n    ai.mjs\n    auth.mjs\n    db.mjs\n    gemini.mjs\n    http.mjs\n    moderation.mjs\npublic/  (2 files)\nshared/\n  constants.js\n  jwt.js\n  live-core.js\n  secret.js\nsrc/\n  components/\n    bits.jsx\n    Chat.jsx\n    Landing.jsx\n    Message.jsx\n    Panels.jsx\n    Sidebar.jsx\n  lib/\n    api.js\n    live.js\n    store.js\n  App.jsx\n  main.jsx\n  styles.css\ntests/\n  api_test.py\nindex.html\nLICENSE\nnetlify.toml\npackage-lock.json\npackage.json\nREADME.md\nvite.config.js","date":"2026-09-25","readme":"# Parley\n\n**Real-time chat with public rooms, DMs and group chats, and a Gemini co-pilot you can @mention.** Messages, typing indicators, read receipts and reactions reach everyone live, usually in under a second. It runs entirely on Netlify: a streaming edge function for live updates, serverless functions for the API, and Netlify Blobs as the database.\n\n**Live:** https://parley-nishant.netlify.app &nbsp;·&nbsp; **Author:** [Nishant Singh](https://nishant-singhaa0240274.netlify.app)\n\n## Features\n\n**Chat**\n- Public rooms (`#lobby`, `#ai-ml`, `#placements`, `#random`), one-to-one DMs and group chats.\n- Live typing indicators, online presence, unread badges and ✓✓ read receipts in DMs and groups.\n- Emoji reactions, replies with quotes, editing and deleting your own messages.\n- Image and file sharing up to 4 MB: attach, paste or drag and drop, with an upload progress bar and a lightbox.\n- Optimistic sending: your message appears instantly, then reconciles with the server copy.\n- One-click guest accounts with random names, or sign up with a username and password.\n\n**Gemini**\n- **@gemini** in any message and Gemini replies in the thread, using the recent conversation as context.\n- **Smart replies:** three suggested responses to the latest message.\n- **Catch me up:** a summary and key points of what you missed.\n- **Translate** any message between English and Hindi.\n\n**Safety**\n- Passwords hashed with scrypt; sessions are HS256 JWTs signed with the Web Crypto API.\n- DMs and groups are readable only by their members (checked on every API call and on the live stream).\n- A word filter masks common English and Hinglish abuse in public rooms.\n- Per-user and per-IP rate limits on sign-ups, messages, uploads and AI calls.\n- Uploaded HTML, SVG and script files are served as downloads, never rendered.\n\n## How the live updates work\n\nNetlify doesn't run long-lived WebSocket servers, so Parley uses **Server-Sent Events from an edge function**:\n\n```mermaid\nsequenceDiagram\n  participant A as Browser A\n  participant API as Function /api/*\n  participant DB as Netlify Blobs\n  participant Edge as Edge function /api/live\n  participant B as Browser B\n  B->>Edge: EventSource (live ticket, open chat, last seq)\n  A->>API: POST /api/convs/lobby/messages\n  API->>DB: claim m/lobby/42 (only if new)\n  API->>DB: update head/lobby (seq, preview)\n  API-->>A: 201 (optimistic bubble confirmed)\n  loop every 0.7 s\n    Edge->>DB: read heads + inbox, probe m/lobby/43\n  end\n  Edge-->>B: event: head, event: messages\n```\n\n- **Ordering without a database server.** Each message is stored under its own key, `m/\u003cchat>/\u003cseq>`. A sender claims the next sequence number with a conditional write (`onlyIfNew`) and reads it back to confirm it won. If another sender got there first, it takes the next number. In the test suite, 40 messages sent at once by three users are all stored, with no gaps or duplicates.\n- **Cheap to run.** Edge functions are billed per request, not per second. Each stream lasts 25 seconds and then reconnects, so an open tab costs about 150 stream requests an hour. Background tabs pause their stream after a minute and catch up when you come back.\n- **Fallbacks.** If streaming fails three times (for example, behind a proxy that buffers responses), the app switches to polling `/api/sync` every 2 seconds, and the status in the sidebar changes to \"Syncing every 2 s\".\n- **Edits and reactions** bump a revision number on the chat's head document; the stream then sends the changed messages.\n- **DMs and groups** also fan out to each member's inbox document, which drives unread badges and makes new chats appear in the sidebar.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Browser\n    UI[React UIoptimistic store] --> ES[EventSource]\n  end\n  UI -- \"REST + JWT\" --> F[Netlify Function/api/* router]\n  ES -- \"SSE\" --> E[Edge function/api/live]\n  F --> DB[(Netlify Blobsusers · chats · messagesheads · inboxes · files)]\n  E --> DB\n  F --> G[Gemini API]\n```\n\n| Layer | Technology |\n|---|---|\n| Frontend | React 18, Vite, Framer Motion, a small `useSyncExternalStore` store |\n| Live updates | Netlify Edge Function (Deno) streaming Server-Sent Events, with a polling fallback |\n| API | Netlify Functions (Node 22), one router for 24 routes |\n| Database | Netlify Blobs (strong consistency, conditional writes) |\n| Auth | scrypt password hashes, HS256 JWTs (Web Crypto), short-lived tickets for the stream |\n| AI | Gemini API with structured JSON output and a fallback chain across models |\n\n### Data model (Blobs keys)\n\n| Key | Contents |\n|---|---|\n| `users/\u003cid>`, `handles/\u003chandle>` | Profile and password hash; handle claimed with `onlyIfNew` |\n| `d/\u003chandle>~\u003cid>~…` | People directory (search reads key names only, no documents) |\n| `conv/\u003cchat>` | Room, DM or group: type, name, members |\n| `head/\u003cchat>` | Latest seq, preview, typing, read positions, edit revision |\n| `m/\u003cchat>/\u003cseq>` | One message |\n| `inbox/\u003cuser>` | A user's DMs and groups, with their read positions |\n| `presence/\u003cuser>`, `file/\u003cid>`, `limit/…` | Last seen, uploads (with metadata), rate-limit windows |\n\n## API\n\nAll routes except auth, health and file downloads need `Authorization: Bearer \u003ctoken>`.\n\n| Method | Path | Description |\n|---|---|---|\n| `POST` | `/api/auth/signup` · `/login` · `/guest` | Create an account, sign in, or get a guest account |\n| `GET` | `/api/bootstrap` | You, your chats with their heads, users, AI status |\n| `PATCH` | `/api/me` | Change display name or about |\n| `GET` | `/api/users?q=` | Search people |\n| `POST` | `/api/convs` | Start a DM `{type:\"dm\", with}` or group `{type:\"group\", name, members}` |\n| `GET` | `/api/convs/:id/messages?before=|after=` | Page through history (50 at a time) |\n| `POST` | `/api/convs/:id/messages` | Send `{text, fileId?, replyTo?, cmid?}` |\n| `PATCH` | `/api/convs/:id/messages/:seq` | `{react}`, `{text}` or `{delete:true}` |\n| `POST` | `/api/convs/:id/typing` · `/read` | Typing indicator, read position |\n| `POST` | `/api/convs/:id/ai/reply` · `/smart-replies` · `/catch-up` | Gemini features |\n| `POST` | `/api/ai/translate` | `{text, to: \"en\" \\| \"hi\"}` |\n| `POST` / `GET` | `/api/files` · `/api/files/:id` | Upload (multipart, 4 MB) and download |\n| `POST` | `/api/live-ticket` | A 10-minute ticket for the stream |\n| `GET` | `/api/live?t=&c=&s=` | The live stream (edge function) |\n| `GET` | `/api/sync` | Polling fallback |\n| `GET` | `/api/health` | Status and configuration |\n\n## Run it locally\n\n```bash\nnpm install\nnpm install -g netlify-cli\nnetlify dev              # app + API + local Blobs at http://localhost:8888\n```\n\nOptional: put `GEMINI_API_KEY=...` in a `.env` file to turn on the AI features.\n\nLocal development streams from a Node twin of the edge function (`/api/live-node`, which returns 410 in production), because the Deno runtime for edge functions isn't always available offline. Both use the same code in `shared/live-core.js`.\n\nWith `netlify dev` running, run the API tests (39 checks: auth, permissions, concurrency, DMs, groups, reactions, edits, files, moderation, sync):\n\n```bash\npython3 tests/api_test.py\n```\n\n## Deploy (Netlify free plan)\n\n1. Push this folder to a GitHub repository named `parley`.\n2. Netlify → **Add new project → Import an existing project → GitHub** → pick `parley`. Build settings come from `netlify.toml`.\n3. Before deploying, add the environment variable `GEMINI_API_KEY` and mark it as a secret.\n   - Optional: `JWT_SECRET`, at least 16 characters. Without it, a random secret is generated once and kept in Blobs.\n   - Optional: `ADMIN_HANDLES`, a comma-separated list of usernames that can delete any message in public rooms.\n   - Optional: `GEMINI_MODEL`, a model to try before the built-in list.\n4. Name the project `parley-nishant`, deploy, then click **Make public**.\n\n## Project structure\n\n```\nshared/live-core.js       the live stream (used by the edge function and the dev twin)\nshared/jwt.js             HS256 sign/verify on Web Crypto (Node + Deno)\nshared/constants.js       rooms, limits, reactions\nnetlify/edge-functions/   live.js: SSE stream at /api/live\nnetlify/functions/        api.mjs (REST router), live-node.mjs (local dev only)\nnetlify/lib/              db (Blobs, seq claims, heads, inboxes), auth, ai, gemini, moderation\nsrc/lib/                  store (state + optimistic updates), live (EventSource + fallback), api\nsrc/components/           Landing, Sidebar, Chat + Composer, Message, Panels\ntests/api_test.py         end-to-end API tests\n```\n\n## License\n\nMIT © Nishant Singh"},{"id":"crossbridge","n":"CrossBridge","r":"Cross-Bridge","top":3,"col":["#229ed9","#25d366"],"live":"https://crossbridge-nishant.netlify.app","t":"Telegram ⇄ WhatsApp in real time, with receipts, translation and exactly-once delivery.","c":["sys","ai"],"k":"Messaging bridge","s":["TypeScript","React 18","Hono","Netlify Functions","Netlify Blobs","Telegram Bot API","Twilio WhatsApp","Gemini API","Zod","Python"],"kw":["messaging","bridge","integration","telegram","whatsapp","bot","chatbot","webhook","twilio","api integration","translation","summarization","real-time","idempotency","exactly once","rate limiting","automation","full stack"],"what":"Links a Telegram chat with a WhatsApp number. Text, photos, voice notes, videos and documents cross both ways in about a second, paired with a short code.","how":"Telegram and Twilio webhooks hit one Hono app in a Netlify Function, which runs a relay pipeline: dedupe → commands and pairing → media → translate → format → deliver → log. Media is copied to Netlify Blobs and served from short-lived URLs.","special":"Delivery receipts move queued → sent → delivered → read and never backwards, and failures such as a closed 24-hour WhatsApp window are explained to the sender in plain words.","diff":"Exactly-once processing: Telegram update_ids and Twilio MessageSids are claimed with atomic only-if-new writes, so webhook retries never create duplicates, and a failed run releases the claim so the platform can retry.","arch":["Telegram Bot API webhook","Twilio WhatsApp webhook (HMAC)","Hono app in one Netlify Function","Relay pipeline: dedupe → pair → media → translate → deliver","Netlify Blobs: bridges, logs, media, receipts","Gemini (translate, /summary)","React dashboard + simulator"],"img":"data:image/webp;base64,UklGRsJYAABXRUJQVlA4ILZYAABQtwGdASrAAxwCPp1MoUylpD+lozHpq/ATiWVu/qBNt/fx/zRGI/x7eVSf7PzZBqB4cIoK253//jbD1/2f8r4Poafrf3P1F+Re/PgD1+v6PfT2v5i/TH7o9rv+49Uv909ST/Bf2fzwv2790v969B37nfsv7vnpq/wnqAf23/ves16xvoRecx/3v3E+Gz+6f839xvgY/an///9/3APQA6ofq7/mv7f7Avj/7b/mv7d5M/jn1T+h/vH7u+v1nP9W/tPNn+Wfar+J/gPQb/bf238nfSX5O/7/9t9gX8n/o37Ab8XtP+89AL2b+uf+L/K+KN/of4P1E/Q/71/2/cA/lv9i/7v979x/9H4TP3r/eftn8AX81/uX/x/2n+c+G3+y//X+39CX6D/sf26+BH9g+vP6Yw01MpaJd8TLgn5aIwuPIGzuuXyyCoi8k/Vy+tomAQbluo81n6GXMb6LpUMuY30XSoZcxvoulQy5jfR6ShFoZqGOW+XwwAL9gDJWM2bYaBLeDbGN8d/ogPKdFm60T/cCERPiEhg3AFIEJgfo9nS3HgP2Wppy8gm8 ts\n    crypto.ts\n    env.ts\n    gemini.ts\n    relay.ts\n    store.ts\n    telegram.ts\n    twilio.ts\npublic/  (3 files)\nshared/\n  types.ts\nsrc/  (15 files)\ntests/\n  e2e.env\n  e2e_test.py\n  mock_services.py\n  unit.test.ts\nindex.html\nLICENSE\nnetlify.toml\npackage-lock.json\npackage.json\nREADME.md\ntsconfig.json\nvite.config.ts","date":"2026-09-25","readme":"# CrossBridge\n\n**Telegram ⇄ WhatsApp, in real time.** CrossBridge links a Telegram chat (private or group) with a WhatsApp number. Text, photos, voice notes, videos and documents cross both ways in about a second, with delivery receipts, optional AI translation and on-demand summaries. A web dashboard shows every message's path through the pipeline, and a live simulator lets anyone try it without a phone.\n\n**Live:** https://crossbridge-nishant.netlify.app &nbsp;·&nbsp; **Author:** [Nishant Singh](https://nishant-singhaa0240274.netlify.app)\n\n## Features\n\n**Bridging**\n- **Pair in a minute with a code.** Send `/start` to the bot on Telegram (or add it to a group), get a code like `CB-7K2PQ`, and send that code on WhatsApp. It works the other way round too: send `link` on WhatsApp and `/link CB-XXXXX` on Telegram.\n- **Both directions, all common media.** Text, photos, voice notes, videos and documents up to 5 MB. Media is copied to Netlify Blobs and served from a short-lived URL that Telegram and Twilio fetch.\n- **Sender names** (on or off), \"edited\" markers for edited Telegram messages, and HTML escaping so nothing a user types can break the formatting.\n- **Chat commands** on both sides: `/status`, `/summary`, `/translate hi` (or `off`), `/pause`, `/resume`, `/unlink`, `/help`, and `/login` on Telegram.\n\n**Reliability**\n- **Delivery receipts.** Twilio status callbacks move each message through queued → sent → delivered → read, and never backwards.\n- **Failures explained in plain words.** When WhatsApp's 24-hour reply window has closed, or a number never joined the sandbox, the sender is told on Telegram instead of the message silently disappearing.\n- **Exactly-once processing.** Telegram `update_id`s and Twilio `MessageSid`s are claimed with atomic `onlyIfNew` writes, so webhook retries never send duplicates. If processing fails, the claim is released so the platform can retry.\n- **Rate limits** per bridge (300 messages a day), per IP and per command, and a single \"forwarding is paused\" notice instead of one per message.\n\n**AI (Gemini, optional)**\n- **Translation per direction:** for example, everything arriving on WhatsApp in Hindi and everything arriving on Telegram in English. Gemini returns structured JSON and skips messages already in the target language.\n- **`/summary`:** decisions, open questions and to-dos from the last 40 messages, in the reader's language.\n- Everything works without a Gemini key; AI features simply switch off.\n\n**Web app**\n- **Simulator:** two phones wired through the real pipeline. Only the last hop is simulated. Each message shows a timed **pipeline trace** (received → media → translated → formatted → handed over).\n- **Dashboard** with no passwords: `/login` in a private Telegram chat returns a one-time sign-in link (10 minutes). It lists your bridges, a live message log with receipts and traces, and settings such as name, translation, sender names, pause and unlink. WhatsApp numbers are masked.\n- **Connect** page with QR codes for the bot and a pre-filled WhatsApp message, and a **Setup** checklist that checks the deployment's configuration and registers the Telegram webhook.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  TG[Telegram Bot API] -- \"webhook + secret token\" --> F\n  TW[Twilio WhatsApp] -- \"webhook + HMAC-SHA1 signature\" --> F\n  TW -- \"status callbacks\" --> F\n  subgraph Netlify\n    F[\"/api/* · Hono app in one Netlify Function\"] --> P[\"relay pipelinededupe → commands/pairing → media → translate → format → deliver → log\"]\n    P --> B[(\"Netlify Blobsbridges · indexes · logs · media · receipts\")]\n    C[\"cleanup · scheduled daily\"] --> B\n  end\n  P -- sendMessage / sendPhoto … --> TG\n  P -- Messages API --> TW\n  P -- structured JSON --> G[Gemini API]\n  W[\"React + TypeScript web appsimulator · dashboard · setup\"] --> F\n```\n\n- **One pipeline for everything.** `netlify/lib/relay.ts` handles every inbound message the same way, whichever side it came from. The simulator runs the same code; only `deliver()` writes to the log instead of calling Telegram or Twilio.\n- **Webhook security.** Telegram requests must carry the `X-Telegram-Bot-Api-Secret-Token` set during registration (derived from the bot token with HMAC, compared in constant time). Twilio requests are verified with `X-Twilio-Signature` (HMAC-SHA1 over the URL and sorted parameters).\n- **Storage (Netlify Blobs).** Bridges live at `b/\u003cid>` with indexes `idx/tg/\u003cchatId>` and `idx/wa/\u003cnumber>`, pairing codes at `code/\u003cCODE>` (30 minutes), logs at `log/\u003cid>` (last 300 entries), `pid/\u003csid>` maps a Twilio message to its log entry for receipts, and `owner/\u003ctelegramUserId>` powers the dashboard. Writes that can race use ETag-conditional updates with retries.\n- **Auth.** The dashboard uses HS256 JWTs signed with Web Crypto. Sign-in links are single-use tokens delivered by the bot, so no passwords are stored.\n- **Housekeeping.** A scheduled function deletes simulator sessions after a day, media after a week, and expired dedupe keys, rate-limit windows and sign-in links.\n\n### API\n\n| Method | Path | What it does |\n|---|---|---|\n| POST | `/api/webhooks/telegram` | Telegram updates (secret header required) |\n| POST | `/api/webhooks/twilio` | Incoming WhatsApp messages (signature required) |\n| POST | `/api/webhooks/twilio/status` | Delivery receipts |\n| GET | `/api/media/:id` | Relayed media (safe content types only, `nosniff`) |\n| GET | `/api/health` | Configuration status and webhook URLs |\n| GET | `/api/stats` | Bridges, messages and 14-day activity |\n| POST | `/api/setup/telegram` | Registers the webhook and command menu (needs the bot token) |\n| POST | `/api/auth/exchange` | One-time sign-in link → session |\n| GET | `/api/me` | Your bridges |\n| GET · PATCH · DELETE | `/api/bridges/:id` | Log and settings; unlink |\n| POST · GET · PATCH | `/api/sim`, `/api/sim/:id` | Simulator sessions |\n| POST | `/api/sim/:id/send` | Send a message through the pipeline |\n\n## Tech stack\n\nTypeScript (strict) everywhere · React 18 + Vite · Framer Motion · React Router · Hono on Netlify Functions · Zod validation · Netlify Blobs · Telegram Bot API · Twilio Programmable Messaging (WhatsApp) · Gemini API · Web Crypto (HMAC, SHA-256, JWT).\n\nDesign: a blueprint drawing sheet in Prussian blue with white linework and amber annotations; Barlow Condensed, Barlow and Spline Sans Mono.\n\n## Run it yourself\n\nYou need a Telegram bot, a Twilio account with the WhatsApp sandbox, and (optionally) a Gemini API key.\n\n1. **Telegram bot:** message [@BotFather](https://t.me/BotFather), send `/newbot`, and copy the token. For groups, also send `/setprivacy` → your bot → **Disable**, so the bot sees every message.\n2. **Twilio WhatsApp sandbox:** in the Twilio Console open **Messaging → Try it out → Send a WhatsApp message**. Note the sandbox number (for example `+14155238886`) and your join phrase (`join something-something`). Copy the **Account SID** and **Auth Token** from the console home page.\n3. **Netlify:** import the repo, then add these environment variables **before the first deploy** (mark tokens as secret):\n\n   | Variable | Required | Example |\n   |---|---|---|\n   | `TELEGRAM_BOT_TOKEN` | yes | `123456789:AA…` |\n   | `TWILIO_ACCOUNT_SID` | yes | `AC…` |\n   | `TWILIO_AUTH_TOKEN` | yes | from the Twilio console |\n   | `TWILIO_WHATSAPP_NUMBER` | yes | `+14155238886` |\n   | `TWILIO_SANDBOX_KEYWORD` | for the sandbox | `something-something` (the words after \"join\") |\n   | `GEMINI_API_KEY` | no | enables translation and summaries |\n   | `GEMINI_MODEL` | no | overrides the default model |\n   | `JWT_SECRET` | no | 32+ random characters; one is generated and stored if omitted |\n\n4. **Webhooks:** open `/setup` on your site. Paste the bot token to register the Telegram webhook. Then, in Twilio's sandbox settings, set **When a message comes in** to `https://\u003cyour-site>/api/webhooks/twilio` (POST). The setup page shows both URLs and ticks off each part of the configuration. Delivery receipts need no setup: every outgoing WhatsApp message carries its own status-callback URL.\n5. On WhatsApp, send the join phrase to the sandbox number, then follow the **Connect** page.\n\nWhatsApp only lets a business number reply within 24 hours of the person's last message, and the sandbox only reaches numbers that have joined it. CrossBridge tells you on Telegram when either rule blocks a message.\n\n### Local development\n\n```bash\nnpm install\ncp tests/e2e.env .env          # points the app at local mock services\npython3 tests/mock_services.py # mock Telegram, Twilio and Gemini on :9998\nnpx netlify dev                # http://localhost:8888\n```\n\n## Tests\n\n- `npm test`: unit tests for Twilio signatures (including Twilio's documented example), update parsing, number normalisation, JWTs and pairing codes.\n- `npm run typecheck`: strict TypeScript across the app, functions and tests.\n- `python3 tests/e2e_test.py`: 43 end-to-end checks against the mock services, covering webhook security, pairing, relaying both ways, media, retries, translation, summaries, pause, delivery receipts, 24-hour-window failures, the dashboard and the simulator.\n\nThe screenshots come from a local run against these mock services.\n\n## License\n\nMIT © 2026 Nishant Singh"},{"id":"aqueduct","n":"Aqueduct","r":"Aqueduct","top":4,"col":["#0891b2","#082f49"],"live":"https://aqueduct-nishant.netlify.app","t":"A distributed-systems studio: compose an architecture and watch it cache, shard and recover.","c":["sys","play"],"k":"System design simulator","s":["TypeScript","React 18","Vite","Three.js","WebGL shaders","HTML5 Canvas","Netlify Functions","Java","Spring Boot","GSAP"],"kw":["system design","distributed systems","architecture","simulator","simulation","rate limiter","token bucket","lru cache","consistent hashing","circuit breaker","load balancing","sharding","autoscaling","microservices","devops","ci/cd","cloud","backend","data structures","algorithms"],"what":"A live traffic simulation over a composable topology (clients → gateway → replicas → cache → sharded DB). Turn off the cache, break a replica or change the shard count and the metrics respond.","how":"Five primitives are implemented from scratch and unit-tested: a binary-heap priority queue, an O(1) LRU cache, a token-bucket rate limiter, a consistent-hash ring and a circuit breaker. The same primitives are exposed as real endpoints.","special":"The hero is a real-time WebGL fragment shader of domain-warped fractal noise that bends toward the cursor.","diff":"The hash ring is verified to move only about 1/N of keys when a node joins, using an avalanche finalizer to fix the clustering plain FNV-1a causes on sequential keys. The gateway is also written in Java / Spring Boot as a reference.","arch":["Clients","Gateway: token-bucket rate limiter","Service replicas + circuit breaker","LRU cache","Consistent-hash ring → shards","Canvas traffic sim + metrics","Netlify Functions /api/ratelimit · cache · hashring"],"img":"data:image/webp;base64,UklGRrZUAABXRUJQVlA4IKpUAACwkAGdASrAAxwCPp1Oo0ylpC8zIzRo2mATiWdu/CoIMwicEYv+/96uI7dyl+cZK2nXOCmT6I2fw23JnvH/h39n/T9c39858/15+ZrzjvTx/hvMA9Yz1mP7z6sHnSetX/gsle+Cfsr6pvjP71/m/7V+QnkR+tfxn93/dj/D+4Brn9N/tvM3+R/bn9//gvPD/t+C/5n++/9z1CPyT+j/7LxYf8HtV+A/0H/i/0XsC+zH1f/yeBF/g/331K+uP/h/yfwA/0b+sf872B/3Xgp/h/937AX8u/vf/j/x/5tfTR/b+Qz9C/2H7YfAX/Of7z1xxK/fJDysV6td8uKi4I+Z8QFlp3rRGExfII1031w110cczsHk0gngdThyRY5Bdv9S1eQacmFBbpySDxerqA1kI50ahfhDC+QIBTh5tGv8dXeK0pBcVU6C5L3KMKsexH  break a replica, and the metrics respond in real time: throughput, cache hit-rate, p95 latency, error rate, shard balance and replica load. The particles are real requests; the numbers come from the actual primitives running.\n- **The engine room** — five distributed-systems primitives, built and tested:\n  - **Priority queue** (binary heap) — the task scheduler\n  - **LRU cache** — O(1) get/put with hit-rate tracking\n  - **Token-bucket rate limiter** — the gateway's admission control\n  - **Consistent-hash ring** — shards keys with ~1/N movement on scale-out\n  - **Circuit breaker** — trips open on repeated failure, probes half-open, closes on success\n- **Architecture review** — score four patterns (monolith → 3-tier → microservices+cache → multi-region) across availability, consistency, cost and scalability. The deliberate trade-off lens.\n- **DevOps pipeline** — a commit-to-production delivery pipeline: build, test, containerize, provision (IaC), rolling deploy, observe.\n- **Live backend** — the same primitives exposed as real endpoints (`/api/health`, `/api/ratelimit`, `/api/cache`, `/api/hashring`).\n\n## The hero\n\nThe landing is a real-time WebGL fragment shader — domain-warped fractal noise flowing like deep water, bending toward the cursor — with editorial serif typography. It honours `prefers-reduced-motion`.\n\n## Tech stack\n\nTypeScript everywhere · React 18 + Vite · **Three.js** (WebGL fluid shader) · HTML5 Canvas (the traffic sim) · Netlify Functions (Node 22) · hand-built design system. No charting or UI library.\n\n## The backend, honestly\n\nThe live backend runs on **Netlify Functions (Node/TypeScript)** so the whole site deploys in one step. The *same gateway* is also written in **Java / Spring Boot** under [`reference/springboot/`](reference/springboot/) — REST controllers, a thread-safe token bucket, constructor injection — the Scaler Spring Boot course stack, for roles that interview on the JVM. It builds and runs locally; it just isn't deployed with the static site (a JVM service needs its own host).\n\n## What it demonstrates\n\n| Area | Certification |\n|---|---|\n| Priority-queue scheduler, data structures | Walmart — Advanced Software Engineering |\n| Microservice decomposition, the gateway | Skyscanner — Software Engineering |\n| REST service + backend | HPE — Software Engineering; Scaler Spring Boot |\n| Trade-off review (availability/consistency/cost/scale) | BCG — IT Architecture; Forage Solutions Architecture |\n| Multi-cloud topology, autoscaling, sharding | Datacom — Introduction to Cloud |\n| East-West routing, SDN/NFV framing | JNCIA-Cloud (Juniper) |\n| CI/CD, containerize, IaC, rolling deploy | Udemy — DevOps |\n| Rate limiting, caching, circuit breaking | Resilience patterns — beyond the coursework |\n\n## Run it\n\n```bash\nnpm install\nnpm run build\nnpx netlify dev          # http://localhost:8888\n```\n\n## Tests\n\n```bash\nnpm test          # 28 checks\nnpm run typecheck # strict TypeScript\n```\n\n- **Unit** — the five primitives, including a consistent-hash ring verified to stay balanced and to move only ~1/N of keys when a node joins (an avalanche finalizer fixes the clustering that plain FNV-1a would cause on sequential keys).\n- **Backend** — drives the Functions handler: the rate limiter throttling a burst, the cache hitting on the second read, the ring's distribution staying balanced.\n\nCI runs typecheck, tests and build on every push (`.github/workflows/ci.yml`).\n\n## Deploy on Netlify\n\nBuild command `npm run build`, publish directory `dist`. The functions in `netlify/functions/` are picked up automatically. No environment variables required.\n\n## License\n\nMIT © 2026 Nishant Singh."},{"id":"customer-data-bridge","n":"Customer Data Bridge","r":"Meridian-Health","col":["#ff5a1f","#1c1917"],"live":"https://meridian-health-lime.vercel.app","t":"An integration and data-sync workbench for mapping customer records between systems.","c":["mgmt","sys"],"k":"Enterprise Sa nd where they broke, with a robustness grade and reproduction steps.\n\n---\n\n## Defensive by design — \"canary-safe\"\n\nReal red-teaming can mean coaxing a model into genuinely harmful output. **AutoRedTeam deliberately does not do that.** It swaps the harmful goal for a **harmless planted secret** (a \"canary\" word) and a forbidden marker. The attacks only ever try to make the bot reveal the canary or trip a rule — so you measure whether a guardrail *holds* without ever producing dangerous content. Test only bots you own.\n\n---\n\n## Features\n\n| Feature | What it does |\n|---|---|\n| **Attack battery** | 8 vectors — injection, override, role-play jailbreak, system-prompt leak, encoding/translation smuggling — fired at your target. |\n| **Scored report** | Robustness score /100, an A–F grade, held/bypassed counts, and the worst finding. |\n| **Watch it fail** | Expand any finding to see the exact attack sent and the bot's actual response (canary redacted). |\n| **Mutation fuzzer** | Auto-generates reworded variants of one attack to hunt for a phrasing that slips through. |\n| **Patch & re-scan** | Edit the system prompt, re-run, and see the robustness delta vs the last scan. |\n| **Attack library** | A field guide to every technique: how it works, an example, and the defense. |\n| **Attack builder** | Write your own canary-safe attack, fire it, and save it to your battery (stored locally). |\n| **Export report** | Print/save the findings report. |\n| **Live 3D hero** | A real-time WebGL scene (Three.js): attacks strike the guardrail, most deflect, one breaches. |\n\n---\n\n## How it works\n\n- The **target** is a Gemini model running **your system prompt** (via `system_instruction`). The attack is sent as the user message.\n- The serverless function `/api/attack` runs the target and returns its response. The client **judges deterministically** — did the response contain the canary or the forbidden marker? — so results are reliable and free.\n- The **mutation fuzzer** uses the same endpoint in `mutate` mode to generate safe variants.\n- The AI key stays **server-side** as `GEMINI_API_KEY`.\n\n---\n\n## Pages\n\n```\nautoredteam/\n├── index.html      # Home — live 3D hero\n├── scan.html       # Configure target · run battery · report · fuzzer · patch & re-scan\n├── attacks.html    # Attack library (field guide)\n├── builder.html    # Custom attack builder\n├── app.js          # Shared: targeting cursor, attack battery, backend helpers\n├── style.css       # Shared design system\n├── api/\n│   └── attack.js   # Serverless → Gemini (target run + mutations)\n└── README.md\n```\n\n---\n\n## Deploying to Vercel (free)\n\n1. Push this folder to a GitHub repo.\n2. Vercel: **Add New → Project → Import** → Framework **Other**, build settings empty.\n3. Get a free Gemini key at **[Google AI Studio](https://aistudio.google.com/app/apikey)**.\n4. Vercel → **Settings → Environment Variables** → add `GEMINI_API_KEY` (Production + Preview).\n5. Deploy. Vercel auto-detects `api/attack.js`.\n\nThe scan/fuzzer/builder need the deployed backend. In a static/local preview, use **“See a sample report”** on the Scan page, and the 3D hero + attack library work without any key.\n\n---\n\n## Honest notes\n\n- Robustness grades are a **signal, not a guarantee** — a pass means these specific probes held, not that the bot is unbreakable.\n- Judging is deterministic on the canary/marker; subtle partial leaks may need a human eye (the full response is shown).\n- The 3D hero is real-time **stylized** WebGL, not pre-rendered film art.\n- Free Gemini is rate-limited; a full scan is several calls, so you may hit limits — wait a minute and retry.\n\n---\n\n*Adversarial testing for AI. Canary-safe. For bots you control.*","top":6},{"id":"privacyprism","n":"Privacy Prism","r":"Privacy-Prism","col":["#a855f7","#06b6d4"],"live":"https://privacy-prism-alpha.vercel.app","t":"A browser-only lab for checking whether synthetic data is safe and useful to release."," AlfMSox6I1QeHK5TI4IcFNieAY/ZfXcVnVUkLKzMYveQsQLQ3Ja8Q3EGr1aHnWicm+0dbx6qFc1W4k2o0Gz9MF9v8NVnyyEMY2BD5X2zkIgk57cAtdEEASnX5NNQUfSyZh5l+92eF2Pl6+KdjssuUQ312RhhH7X6o5L7gAAAA==","files":5,"loc":498,"langs":[["JavaScript",285],["HTML",169],["CSS",44]],"tree":"app.js\nindex.html\nprism.js\nREADME.md\nstyles.css","date":"2026-10-16","readme":"# Privacy Prism\n\nPrivacy Prism is a free, browser-only synthetic-data release-readiness lab. It compares an original/reference CSV with a synthetic CSV and turns the results into readable evidence for a human review. The selected visual direction is the dark **Privacy Prism** concept: graphite panels, large readable typography, a sharply faceted vector crystal, animated light dispersion, and pointer-responsive tilt.\n\n## Start\n\nOpen `index.html` directly, or serve this folder locally:\n\n```sh\npython3 -m http.server 8000\n```\n\nVisit `http://localhost:8000`. No build step, package installation, account, API key, or paid service is required. Google Fonts improve the visual match; the design falls back to system fonts if they are unavailable.\n\n## Deploy on Vercel\n\n1. Upload the contents of this folder to the root of a GitHub repository.\n2. Import the repository in Vercel.\n3. Choose **Other** as the framework preset, leave the build command empty, and set the output directory to `.`.\n4. Deploy.\n\n## Preserved core features\n\n- **Utility and fidelity:** compare numeric distributions with a two-sample empirical CDF distance plus standardized mean movement; compare categories with total variation distance.\n- **Nearest-row similarity screen:** compare up to 250 synthetic rows against up to 250 source rows using normalized, shared non-identifier fields; report exact overlaps and mean nearest-row similarity.\n- **Group coverage:** compare proportions for one selected categorical field and inspect missing categories.\n\n## Ten added checks and workflows\n\n1. **Schema alignment:** find source-only and synthetic-only columns.\n2. **Missingness fidelity:** compare per-field null rates.\n3. **Distribution-shape screen:** report KS distance for numeric fields and total variation distance for categories.\n4. **Relationship drift:** compare pairwise Pearson correlations for numeric feature pairs.\n5. **Range and category validity:** identify numeric values outside the source range and categories not observed in the source.\n6. **Record integrity:** count duplicate rows in both datasets.\n7. **Attribute-inference scenario:** choose known fields and a sensitive field to see whether synthetic groups can help predict source values, with a majority baseline.\n8. **Intersectional coverage:** compare two-field combinations to find source combinations absent from synthetic data.\n9. **Downstream model utility proxy:** compare a simple 1-nearest-neighbor classifier trained on source versus synthetic rows, evaluated on held-out source rows.\n10. **User-defined release gate and evidence pack:** set thresholds, see PASS / REVIEW / HOLD flags, and download aggregate JSON evidence.\n\nEvery analysis control is functional in the browser. The included customer-style demo data is fabricated for interface exploration and contains no real people.\n\n## Privacy and interpretation\n\nCSV files are parsed in browser memory. The app does not send rows to a server or include rows in the JSON evidence export. It does not save uploaded data in local storage; closing the tab clears it. The optional theme preference is stored locally.\n\nThese are exploratory screens, not a certification, legal assessment, differential-privacy guarantee, or proof against re-identification. Nearest-neighbor similarity is not a probability of disclosure. The inference and model checks are deliberately simple and can be unstable on small data. Range validity can flag legitimate generated tail values. A passing user-defined gate is not evidence that data is safe to publish. Review the in-app **Method & limitations** page and get an appropriate privacy/security review before releasing sensitive data.\n\n## Product position\n\nThe problem is real and active: teams need an understandable release review that examines utility, similarity risk signals, missingness, relationships, and subgroup blind spots together. This project should be presented as a distinctive local-first workflow and visual product experience—not as a claim that synthetic-data evaluation is a wholly untouched research area.","top":7}],"totalLoc":14905,"locked":true}</script>

    toks.forEach(function(t){var best=0;p._f.forEach(function(f){if(f[1]>best&&hit(f[0],t))best=f[1]});if(!best)ok=false;score+=best;if(p._lowset[t])score+=1});
    if(!ok)return;
    p._kw.forEach(function(k,i){var ks=words(k).join(' ');if(ks===phrase){score+=90;why.unshift(p.kw[i])}else if((' '+ks+' ').indexOf(' '+phrase+' ')>-1){score+=55;why.push(p.kw[i])}else if(toks.length>1&&toks.every(function(t){return hit(words(k),t)})){score+=30;why.push(p.kw[i])}else if(toks.length===1&&hit(words(k),toks[0])&&why.length<3)why.push(p.kw[i])});
    if(words(p.n).join(' ').indexOf(phrase)>-1)score+=140;
    if(toks.length>1&&(' '+words(p.k+' '+p.t).join(' ')+' ').indexOf(' '+phrase+' ')>-1)score+=40;
    out.push({p:p,score:score,why:why.filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,3)});
  });
  out.sort(function(a,b){return b.score-a.score||a.p.n.localeCompare(b.p.n)});
  // multi-word queries: keep only results where the words appear together as a concept, when any do
  if(toks.length>1){var strong=out.filter(function(o){return o.score>=toks.length*12+30});if(strong.length)out=strong}
  return out;
}
