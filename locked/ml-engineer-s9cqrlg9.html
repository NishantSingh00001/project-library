<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nishant Singh — Projects for ML Engineer roles</title>
<style>
/* Layout idea: Apple TV. A cinematic spotlight with a 3D cascade of top projects, then horizontally scrolling shelves, then a full grid. */
:root{
  --bg:#eef0f5; --bg2:#e2e6ee; --surface:rgba(255,255,255,.74); --solid:#ffffff;
  --ink:#0d1220; --ink2:#4b556b; --line:rgba(13,18,32,.12);
  --accent:#ea4324; --accent2:#0a9d92; --shadow:0 18px 50px -18px rgba(20,28,50,.35);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --gut:clamp(16px,4vw,56px);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#06080d; --bg2:#0e121b; --surface:rgba(255,255,255,.065); --solid:#121723;
  --ink:#f3f5fa; --ink2:#9da6ba; --line:rgba(255,255,255,.13);
  --accent:#ff7350; --accent2:#35e0cf; --shadow:0 24px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .6s,color .6s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.022em;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.bar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px var(--gut);
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 82%,transparent),transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.clock{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);padding:5px 8px 5px 6px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.clock svg{width:14px;height:14px;color:var(--accent);transition:transform .8s cubic-bezier(.3,1.6,.4,1)}
.clock:hover svg{transform:rotate(40deg)}
.clock em{font-style:normal;opacity:.7;font-weight:500}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--ink2);font-weight:500}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs a{font-size:13px;font-weight:500;color:var(--ink2);padding:6px 12px;border-radius:99px;transition:.25s}
.tabs a:hover{color:var(--ink);background:var(--surface)}
.search{margin-left:auto;position:relative;flex:0 1 340px;min-width:140px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 34px 9px 36px;transition:.3s}
.search input::placeholder{color:var(--ink2)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink2);pointer-events:none}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--line);display:none;font-size:14px;line-height:22px}
.search.has kbd{display:none}.search.has .x{display:block}

/* ---------- spotlight ---------- */
.hero{position:relative;height:clamp(560px,82vh,760px);overflow:hidden;isolation:isolate}
.backdrop{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.35);opacity:0;transition:opacity 1.2s;z-index:-3}
.backdrop.on{opacity:.9}
:root:not([data-mode="dark"]) .backdrop.on{opacity:.62}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(to right,color-mix(in srgb,var(--bg) 88%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 42%,transparent 75%),
  linear-gradient(to top,var(--bg) 0%,transparent 34%)}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:120px;z-index:-1;color:var(--bg)}
.waves path{fill:currentColor}
.waves .w1{opacity:.35;animation:drift 16s ease-in-out infinite alternate}
.waves .w2{opacity:.6;animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(-4%)}}
.hero-in{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:24px;padding:84px var(--gut) 96px}
.copy{max-width:560px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.eyebrow i{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
.copy h1{font-size:clamp(40px,6.2vw,84px);line-height:.98;font-weight:800;margin:14px 0 16px;letter-spacing:-.04em}
.copy p{font-size:clamp(16px,1.5vw,20px);color:var(--ink2);margin:0 0 20px;max-width:46ch}
.swap>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.swap>*:nth-child(2){animation-delay:.06s}.swap>*:nth-child(3){animation-delay:.12s}.swap>*:nth-child(4){animation-delay:.18s}.swap>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{transform:translateY(18px);filter:blur(6px);opacity:.01}to{transform:none;filter:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 20px;border-radius:14px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s,background .25s}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(10px)}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}

.stage{position:relative;height:min(46vw,420px);perspective:1500px;perspective-origin:30% 50%}
.s-card{position:absolute;left:0;top:50%;width:min(62%,560px);aspect-ratio:16/9;margin-top:calc(min(62%,560px)*-0.28);border-radius:22px;overflow:hidden;
  transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.85,.2,1),opacity 1s,filter 1s;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);will-change:transform;background:#111 center/cover;cursor:pointer}
.s-card{background-position:top center}.s-card::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 40%)}.s-card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 30%)}
.s-card b{position:absolute;left:18px;bottom:14px;right:18px;color:#fff;font:800 clamp(18px,2.4vw,30px)/1.05 var(--display);letter-spacing:-.03em;text-shadow:0 2px 18px rgba(0,0,0,.6);z-index:1}
.s-card .out{position:absolute;top:12px;right:12px;z-index:2;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:6px 10px;border-radius:99px;opacity:0;transition:.3s}
.s-card.act .out{opacity:1}
.s-card .out svg{width:12px;height:12px}
.pager{position:absolute;left:var(--gut);bottom:44px;display:flex;gap:6px;align-items:center;z-index:3}
.pager button{width:8px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;transition:width .5s;position:relative}
.pager button.on{width:44px}
.pager button.on::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:fill var(--dur,7s) linear forwards}
.hero.paused .pager button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nav-arrow{position:absolute;bottom:34px;right:var(--gut);display:flex;gap:8px;z-index:3}
.round{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px);transition:.25s}
.round:hover{background:var(--ink);color:var(--bg);transform:scale(1.08)}
.round svg{width:16px;height:16px}

/* ---------- shelves ---------- */
main{position:relative;padding-bottom:80px;overflow-x:clip}
.blob{position:absolute;width:60vw;height:60vw;max-width:800px;max-height:800px;border-radius:50%;filter:blur(110px);opacity:.16;pointer-events:none;z-index:-1}
.blob.a{background:var(--accent);left:-20vw;top:300px}.blob.b{background:var(--accent2);right:-22vw;top:1400px}
.group-h{padding:44px var(--gut) 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.group-h h2{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.035em}
.group-h p{margin:0;color:var(--ink2);font-size:15px}
.shelf{padding-top:26px;position:relative}
.shelf-h{display:flex;align-items:center;gap:10px;padding:0 var(--gut);margin-bottom:10px}
.shelf-h h3{font-size:19px;font-weight:700}
.shelf-h span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.shelf-h .sp{margin-left:auto;display:flex;gap:6px}
.shelf-h .round{width:30px;height:30px}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px var(--gut) 22px;scrollbar-width:none;scroll-padding-left:var(--gut)}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 clamp(240px,23vw,330px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px;padding:18px var(--gut) 0}

.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.poster{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--bg2) center/cover;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:0 10px 26px -14px rgba(0,0,0,.5)}
.card:hover .poster,.poster:focus-visible{--sc:1.045;box-shadow:0 30px 50px -22px rgba(0,0,0,.65),0 0 0 3px color-mix(in srgb,var(--ink) 85%,transparent)}
.poster{background-position:top center}.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,0) 46%)}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover .poster::after{opacity:1}
.poster b{position:absolute;left:14px;right:14px;bottom:11px;color:#fff;font:800 21px/1.05 var(--display);letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.poster small{position:absolute;left:14px;top:12px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.36);backdrop-filter:blur(6px);padding:3px 8px;border-radius:99px}
.poster .go{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;transform:scale(0) rotate(-45deg);transition:transform .35s cubic-bezier(.3,1.6,.4,1)}
.poster .go svg{width:13px;height:13px}
.card:hover .go{transform:none}
.meta{text-align:left;display:block;width:100%;padding:0 4px;border-radius:10px}
.meta p{margin:0;font-size:13.5px;line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.meta span svg{width:11px;height:11px;transition:transform .25s}
.meta:hover span{color:var(--accent)}.meta:hover span svg{transform:translateX(4px)}
.why{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px}
.why i{font-style:normal;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:8px;padding:16px var(--gut) 0}
.filters button{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);transition:.25s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button em{font-style:normal;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

#results{display:none;padding-top:96px;min-height:70vh}
body.searching #results{display:block}
body.searching .hero,body.searching #browse{display:none}
.res-h{padding:0 var(--gut)}
.res-h h2{font-size:clamp(24px,3vw,36px);font-weight:800}
.res-h p{color:var(--ink2);margin:6px 0 0}
.try{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.try button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.try button:hover{border-color:var(--accent);color:var(--accent)}

.reveal{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.pre{transform:translateY(26px)}
footer{padding:40px var(--gut);color:var(--ink2);font-size:13px;border-top:1px solid var(--line);margin-top:60px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer a{text-decoration:underline;text-underline-offset:3px}

/* ---------- detail ---------- */
#detail{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain}
#detail.open{display:block;animation:sheet .55s cubic-bezier(.2,.85,.2,1)}
@keyframes sheet{from{transform:translateY(40px) scale(.985);opacity:.4}to{transform:none;opacity:1}}
.d-hero{position:relative;min-height:440px;display:flex;align-items:flex-end;padding:110px var(--gut) 40px;isolation:isolate;overflow:hidden}
.d-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;animation:ken 24s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,1%)}}
.d-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--bg) 2%,color-mix(in srgb,var(--bg) 62%,transparent) 48%,rgba(0,0,0,.18))}
.d-close{position:fixed;top:14px;right:var(--gut);z-index:90}
.d-back{position:fixed;top:14px;left:var(--gut);z-index:90;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 14px 9px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px)}
.d-back svg{width:14px;height:14px}
.d-title{max-width:900px}
.d-title h1{font-size:clamp(40px,7vw,92px);line-height:.96;font-weight:800;letter-spacing:-.045em;margin:10px 0 14px}
.d-title p{font-size:clamp(17px,1.8vw,22px);color:var(--ink2);margin:0;max-width:52ch}
.d-body{padding:0 var(--gut) 80px;max-width:1440px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:6px 0 34px}
.facts>div{background:var(--bg);padding:14px 16px;min-width:0}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.facts dd{margin:4px 0 0;font:700 20px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts dd small{font:500 12px var(--body);color:var(--ink2);letter-spacing:0}
.langbar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;gap:2px}
.langbar i{display:block;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--ink2)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.d-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.d-title{min-width:0}#detail{overflow-x:hidden}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 24px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:15px;height:15px}
.panel>p{margin:0;font-size:16.5px;line-height:1.6;max-width:70ch}
.panel.hl{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface))}
.panel.hl2{background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 16%,var(--surface)),var(--surface))}
.flow{display:flex;flex-wrap:wrap;gap:10px 0;align-items:stretch;counter-reset:n}.step{display:flex;align-items:stretch;min-width:0}
.node{position:relative;counter-increment:n;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 40px;font-size:14px;font-weight:600;line-height:1.3;max-width:260px;display:flex;align-items:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*70ms)}
.node::before{content:counter(n);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 11px/22px var(--mono);text-align:center}
@keyframes pop{from{transform:scale(.8);opacity:.01}to{transform:none;opacity:1}}
.link{flex:none;width:36px;margin:0 4px;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);background-size:24px 2px;animation:dash 1s linear infinite;position:relative}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--accent)}
@keyframes dash{to{background-position:24px 0}}
pre{font:13px/1.55 var(--mono);background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto;margin:0;white-space:pre;tab-size:2}
.tree .d{color:var(--accent2);font-weight:600}.tree .c{color:var(--ink2)}
.md{font-size:15.5px;line-height:1.65;max-width:78ch}
.md h3{font-size:21px;margin:26px 0 8px}.md h4{font-size:16px;margin:18px 0 6px}
.md p{margin:0 0 12px}.md ul,.md ol{margin:0 0 12px;padding-left:22px}.md li{margin:3px 0}
.md code{font:13px var(--mono);background:var(--solid);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.md pre{margin:0 0 14px}.md pre code{border:0;padding:0;background:none}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.md blockquote{margin:0 0 12px;padding:4px 14px;border-left:3px solid var(--accent2);color:var(--ink2)}
.tw{overflow-x:auto;margin:0 0 14px}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--solid);font-weight:700}
.more-h{font-size:22px;font-weight:800;margin:40px 0 4px}

@media (max-width:900px){
  .tabs{display:none}.brand span{display:none}
  .hero{height:auto}
  .hero-in{grid-template-columns:1fr;padding:92px var(--gut) 96px;gap:30px}
  .stage{height:56vw;order:-1}
  .s-card{width:78%;margin-top:calc(78vw*-0.2)}
  .d-grid{grid-template-columns:1fr}
  .link{width:22px}
}
@media (max-width:520px){.search kbd{display:none}.clock em{display:none}.grid{grid-template-columns:1fr 1fr;gap:16px 10px}.poster b{font-size:16px}.node{max-width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

/* ---------- opening: a point of light arrives from far away, becomes the mark, then passes through ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;overflow:hidden;perspective:900px;animation:introOut .55s 2.6s forwards;cursor:pointer}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,#ffd9cc 28%,rgba(255,115,80,.5) 55%,transparent 75%);opacity:0;animation:flash 3s forwards;pointer-events:none}
.i-core{position:relative;width:min(62vmin,540px);aspect-ratio:1;display:grid;place-items:center;transform-style:preserve-3d;animation:approach 3s cubic-bezier(.55,0,.25,1) forwards}
.i-core>*{grid-area:1/1}
.i-glow{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,150,110,.75) 9%,rgba(255,115,80,.32) 26%,rgba(53,224,207,.16) 46%,transparent 66%);animation:breathe 1s ease-in-out infinite alternate}
.i-rays{width:150%;height:150%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0deg 2deg,transparent 2deg 15deg,rgba(53,224,207,.16) 15deg 16deg,transparent 16deg 30deg);-webkit-mask:radial-gradient(circle,transparent 16%,#000 30%,transparent 68%);mask:radial-gradient(circle,transparent 16%,#000 30%,transparent 68%);animation:spin 6s linear infinite;filter:blur(1.5px)}
.i-ring{width:74%;height:74%;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 40px rgba(255,115,80,.8),inset 0 0 40px rgba(53,224,207,.5);animation:spin 9s linear infinite reverse;border-top-color:transparent;border-bottom-color:transparent}
.i-mark{font:800 clamp(64px,19vmin,170px)/1 var(--display);letter-spacing:-.07em;color:#fff;text-shadow:0 0 30px #fff,0 0 80px #ff7350,0 0 140px #ff7350;animation:markIn 3s forwards}
.i-sub{align-self:end;margin-bottom:12%;font:700 clamp(9px,1.7vmin,14px) var(--display);letter-spacing:.5em;text-indent:.5em;color:#fff;text-transform:uppercase;white-space:nowrap;animation:subIn 3s forwards}
@keyframes approach{0%{transform:translateZ(-12000px) scale(.25)}58%{transform:translateZ(0) scale(1)}76%{transform:translateZ(40px) scale(1.03)}100%{transform:translateZ(860px) scale(4)}}
@keyframes markIn{0%,30%{opacity:0;filter:blur(14px)}58%,80%{opacity:1;filter:none}100%{opacity:0}}
@keyframes subIn{0%,50%{opacity:0;letter-spacing:1.4em}66%,80%{opacity:.9;letter-spacing:.5em}100%{opacity:0}}
@keyframes breathe{to{transform:scale(1.12)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%,78%{opacity:0}92%{opacity:1}100%{opacity:.0}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

/* ---------- tailored view bar ---------- */
.viewbar{padding:22px var(--gut) 0}
.vb-row{display:flex;align-items:center;gap:12px;min-width:0}

.vb-chips button{flex:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);transition:.25s}
.vb-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

}

}

 trained on 17,332 real salaries from the Stack Overflow Developer Survey 2025 across 59 countries, and shows every country in its own currency (Indian pay in lakhs per year).\n\n**Live:** https://salarium-nishant.netlify.app &nbsp;·&nbsp; **Author:** [Nishant Singh](https://nishant-singhaa0240274.netlify.app)\n\n## Features\n\n- **Estimate with a range.** A LightGBM model predicts total yearly pay; two quantile models, calibrated with conformal prediction, give the 80% range. It's in local currency, with the country median marked for comparison.\n- **What moves your number.** Exact SHAP values for every estimate: how much your country, experience, role, company size, work setup and each technology raise or lower pay compared with the average developer in the data.\n- **Your next 30 years.** The same profile at every level of experience, with the range as a band. A monotone constraint means more experience never lowers the estimate.\n- **What-ifs.** The technologies most linked to higher pay for *your* profile (add one with a click and the estimate updates), and the same profile in every other role.\n- **Market data.** Median pay by country (middle half shown), pay by experience for any country, and pay premiums for 103 technologies, roles and work setups, **controlling for country and experience**, with 95% confidence intervals.\n- **Model card.** Test-set accuracy against simpler baselines, range calibration, accuracy by country, feature importance, every data-cleaning step, method and limits.\n- **Offer check (Gemini).** Paste an offer letter or upload a PDF or image. Gemini extracts fixed pay, variable pay, equity, benefits and joining bonus (it understands Indian CTC and \"LPA\"). Salarium converts it to a like-for-like yearly total, places it in your range with an approximate percentile, and writes talking points and a negotiation email. You can also type the numbers without AI.\n- **Real-world accuracy.** Visitors can anonymously check an estimate against their actual pay (rounded to $500, no identity stored). The model page shows the live score next to the test-set score.\n- **Save & share.** Shareable report links (`/r/…`) that recompute the estimate on view.\n\n## The model\n\n| Model (test set, 2,600 people) | Typical error (MdAPE) | R² (log pay) | Within ±25% |\n|---|---|---|---|\n| Global median | ±42.6% | –0.03 | 32% |\n| Country median | ±30.2% | 0.54 | 43% |\n| Ridge regression | ±23.2% | 0.69 | 53% |\n| **LightGBM** | **±21.6%** | **0.70** | **56%** |\n\n- **80% range coverage:** the raw quantile models covered 72.3% of real salaries. After **conformalized quantile regression** on a separate calibration set, the range covers **81.3%** of the test set.\n- **India:** ±34% typical error on 128 Indian test cases, versus ±66% for the country median alone.\n- Salary data is noisy: two people with identical answers can earn very different amounts. That's why the site reports typical error and a calibrated range rather than an \"accuracy\" percentage.\n\n**Pipeline** (`python/`)\n1. `download.py` fetches the survey (141 MB) from Stack Overflow's official archive.\n2. `prepare.py` keeps professional developers who are employed or self-employed and reported pay, then removes outliers **within each country** (Tukey's fences on log pay, which catch monthly salaries typed into the yearly box). Countries need at least 30 clean responses. The result: 49,191 → 17,332 responses, 59 countries and 104 technologies. Local currencies use the exchange rates implied by the survey itself.\n3. `train.py` uses a 70 / 15 / 15 train / calibration / test split, stratified by country. It trains the baselines, the ridge model (one-hot + splines) and LightGBM with native categorical splits and a monotone constraint on experience; settings come from 5-fold cross-validation on the training set only. It then fits the quantile models and conformal adjustment, computes SHAP importance and the market analysis, and exports everything.\n\n**Serving without Python.** The trees are exported to `netlify/model/model.js` and evaluated by a small TypeScript runtime (`shared/model.ts`), which also implements **exact TreeSHAP** (Lundberg et al., 2018). `tests/parity.test.ts` checks it against LightGBM on 300 test rows: predictions and SHAP values match to within 1e-8.\n\nFeatures: country, years of experience, years coding, role, education, company size, IC or manager, work setup, industry, employment type and 103 technologies. **Age and gender are deliberately not used.**\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Offline\n    S[(Stack Overflow survey 2025)] --> P[prepare.pycleaning + features] --> T[train.pyLightGBM + quantiles + conformal]\n    T --> M[model.js1,185 trees]\n    T --> J[market.json · model-card.json · features.json]\n  end\n  subgraph Netlify\n    W[React + TypeScript app] --> F[\"Functions: /api/estimate · /api/reports · /api/reality · /api/offer · /api/health\"]\n    F --> R[TypeScript tree runtime + TreeSHAP]\n    M --> R\n    F --> B[(Netlify Blobsreports · real-world checks · counters · rate limits)]\n    F --> G[Gemini APIoffer reading]\n    J --> W\n  end\n```\n\n### API\n\n| Method | Path | What it does |\n|---|---|---|\n| POST | `/api/estimate` | Profile → range (USD), SHAP drivers, 0–30 year curve, skill and role what-ifs |\n| POST | `/api/reports` | Save a profile, get a share id |\n| GET | `/api/reports/:id` | A saved report with a freshly computed estimate |\n| POST | `/api/reality` | Compare actual pay with the estimate (anonymous) |\n| GET | `/api/reality` | Live real-world accuracy |\n| POST | `/api/offer` | Offer text, file or numbers → like-for-like total, percentile, advice |\n| GET | `/api/health` | Model info, AI status, usage counters |\n\n```bash\ncurl -X POST https://salarium-nishant.netlify.app/api/estimate \\\n  -H \"content-type: application/json\" --data @- \u003c\u003c'EOF'\n{ \"country\": \"India\", \"yearsPro\": 3, \"role\": \"Back-end developer\",\n  \"education\": \"Bachelor's degree\", \"orgSize\": \"1,000–4,999\",\n  \"manager\": \"Individual contributor\", \"remote\": \"Hybrid, mostly office\",\n  \"industry\": \"Software\", \"employment\": \"Employee\",\n  \"skills\": [\"lang_java\", \"web_spring_boot\", \"plat_docker\"] }\nEOF\n```\n\n## Tech stack\n\nPython (pandas, scikit-learn, LightGBM) for training · TypeScript everywhere else · React 18 + Vite · Framer Motion · Netlify Functions (Node 22) · Zod · Netlify Blobs · Gemini API (structured JSON output, PDF and image input) · hand-built SVG charts with tooltips and table views.\n\nDesign: International Typographic (Swiss) style. White paper, black type, one red, a visible 12-column grid, huge numerals; Inter Tight throughout. Blue marks what raises pay and red what lowers it.\n\n## Run it yourself\n\n```bash\nnpm install\nnpx netlify dev                          # http://localhost:8888 (uses the committed model)\n```\n\nRetrain from scratch:\n\n```bash\npip install -r python/requirements.txt\npython python/download.py && python python/prepare.py && python python/train.py\nnpm test                                 # parity + estimate checks\n```\n\nDeploy on Netlify (build `npm run build`, publish `dist`). The only environment variable is **`GEMINI_API_KEY`** (optional, used for reading offers); add it before the first deploy. `GEMINI_MODEL` can override the model.\n\n## Tests\n\n- `npm test`: the TypeScript runtime against LightGBM (predictions and SHAP), plus estimate sanity checks (ordering, monotone curve, SHAP values that add up, speed).\n- `python3 tests/api_test.py`: 28 end-to-end API checks against a local server with a mock Gemini (`tests/mock_gemini.py`), covering validation, reports, anonymous reality checks and rate limits, and offers by text, file and numbers.\n- `npm run typecheck`: strict TypeScript.\n\n## Limits\n\n- Stack Overflow survey respondents aren't a random sample of developers. In India especially, they lean towards people working for foreign companies.\n- Pay was reported in mid-2025 and isn't adjusted for inflation since.\n- Skill premiums are correlations, not causes.\n\n## Data & license\n\nCode: MIT © 2026 Nishant Singh.\nData: [Stack Overflow Developer Survey 2025](https://survey.stackoverflow.co/), made available under the [Open Database License (ODbL 1.0)](https://opendatacommons.org/licenses/odbl/1-0/). The model and statistics on this site are produced works based on that database. The raw survey isn't included in this repository; `python/download.py` fetches it."},{"id":"glyph","n":"Glyph","r":"Glyph","top":2,"col":["#111827","#e11d48"],"live":"https://glyph-nishant.netlify.app","t":"Draw a digit and watch a neural network read it, layer by layer.","c":["ml"],"k":"Deep learning demo","s":["React 18","Vite","TensorFlow","Keras","Python","JavaScript NN runtime","Netlify Functions","Netlify Blobs","Gemini Vision","Framer Motion"],"kw":["deep learning","neural network","cnn","convolutional","mnist","digit recognition","handwriting","image classification","computer vision","tensorflow","keras","machine learning","ml","model visualization","explainable","rest api","community dataset"],"what":"Two MNIST models (a dense network at 97.62% and a CNN at 99.31% test accuracy) run live as you draw, with feature maps, activations and the softmax output updating on every stroke.","how":"Models are trained in TensorFlow/Keras, then weights are exported as float16 and executed by a small JavaScript runtime shared by the browser and a REST API. The drawing is preprocessed exactly as MNIST was built: scaled into a 20×20 box and centred by centre of mass in 28×28.","special":"You can see inside the network: hover a first-layer map to see the 3×3 filter it learned, compare both models, and read a model card with confusion matrices and the most confident mistakes.","diff":"Visitors confirm or correct predictions, and the server re-runs the model itself before saving, so the community real-world accuracy c RFQbIRSGv63puyJmc4OBkA5AsRAQIwBUCpVj3pWgwOSG91Swur6nTk0cFJ3ZHDaNRp4OsC737EJgDFv0LOWdAw926kbEvdjmxXV9AKMcQ84FyX+zQiFiw1Sa+gNC3STqg5aAH0Wa6AU21MnNTndVj85ZdoRR/+V8zqYiUS3B4QSw2ki02LfN+wP2R+yeKGA0wnNa713f9Nq5R9i39eTxFIpK+ncx/n4KEYimmBOXacfL/Cw1xzAAETG6I69giGjS+BVEwlhct3vP2EnObq0gynLCoCeDeYJs5x1d2sl7IhF+6A8KltaMewiRpQMhc4veWB1npXFg9Y3bOzO7kYmX+aOW1u99kvfJC4FDr1sZWFmS4gZQDtICgAWCQxF2uEXe1af171Fek8KnIzwKllWXHQbiPXZoofu9W6Gxdgt5BsplJkkYgOSqTfDOgyIJRnlxKXYqnemRtqag0DGfofdkbepSDFPLQNb9r6xRGH4uysnaI3o9R4a5a09ddegWaG/VyK+1+I9YhUkbKXUt66oKQ3jvZ/51SmGVeVnLoXLovjvCvur9CUNTABrHjciVLPFPmA9noop+rDLgVXqQL6P3zK/6AYQ7Rv5+h8H0+JPVmPVq3YX/fn5pTpu13rNZDRh80TchVXKvMeFPbfR06zOyVnHxo5IYzsyp6P4aGP9tmuSzoAAA","files":47,"loc":2752,"langs":[["JavaScript",2152],["CSS",300],["Python",277],["HTML",23]],"tree":"docs/\n  evaluation.jpg\n  models.jpg\n  network.jpg\n  studio.jpg\nnetlify/\n  functions/\n    dataset.mjs\n    drawings.mjs\n    health.mjs\n    predict.mjs\n    second-opinion.mjs\n    stats.mjs\n  lib/\n    gemini.mjs\n    http.mjs\n    models.mjs\n    store.mjs\npublic/  (4 files)\npython/\n  parity.py\n  requirements.txt\n  train.py\nscripts/\n  js-eval.mjs\nshared/\n  weights/\n    cnn.js\n    dense.js\n  nn.js\nsrc/  (15 files)\nindex.html\nLICENSE\nnetlify.toml\npackage-lock.json\npackage.json\nREADME.md\nvite.config.js","date":"2026-09-25","readme":"# Glyph\n\n**Draw a digit and watch a neural network read it, layer by layer.** Two TensorFlow models trained on MNIST run live in the browser as you draw, the same weights are served through a REST API on Netlify Functions, and every drawing people label goes into a community dataset that measures how the models do on real handwriting.\n\n**Live:** https://glyph-nishant.netlify.app &nbsp;·&nbsp; **Author:** [Nishant Singh](https://nishant-singhaa0240274.netlify.app)\n\n## Results\n\n| Model | Architecture | Params | MNIST test accuracy | Mistakes / 10,000 |\n|---|---|---|---|---|\n| Dense (the original) | 784 → Dense 128 ReLU → Dropout 0.2 → Dense 10 softmax | 101,770 | **97.62%** | 238 |\n| CNN | Conv 16 → MaxPool → Conv 32 → MaxPool → Dropout → Dense 64 → Dropout → Dense 10 | 56,714 | **99.31%** | 69 |\n\n- Trained with TensorFlow 2.21 / Keras on the 60,000 MNIST training digits (10% held out for validation), scored once on the separate 10,000-digit test set.\n- **Not overfitting:** the dense model's validation accuracy tracks its training accuracy (97.9% vs 97.5%), and the CNN's training accuracy (98.6%) is *below* its validation accuracy (99.2%) because it trains on randomly rotated, shifted and zoomed digits.\n- **Real-world accuracy** (digits drawn with a mouse or finger) is measured live on the Community page from visitors' feedback. It's expected to be lower than the benchmark, since screen handwriting looks different from 1990s paper forms.\n\n## Features\n\n- **Drawing pad** with speed-sensitive fountain-pen ink, undo, and live predictions on every stroke.\n- **MNIST-style preprocessing** in the browser: the drawing is scaled into a 20×20 box, anti-aliased, and centred by its centre of mass in 28×28, exactly how MNIST was built. The app shows \"what the model sees\".\n- **Inside the network:** feature maps from both convolution layers, dense-layer activations and the softmax output, updated as you draw. Hovering a first-layer map shows the 3×3 filter it learned.\n- **Two models to compare**, with a model card: training curves, confusion matrices, per-digit accuracy and the most confident mistakes.\n- **Community dataset:** people confirm or correct each prediction. The server re-runs the model itself before saving (so results can't be faked), and the Community page shows real-world accuracy, a confusion matrix of real mistakes, a live wall of drawings, and a CSV export for retraining.\n- **Gemini second opinion:** sends the drawing to Gemini's vision model and shows whether a large multimodal model agrees with the small CNN.\n- **Public API** for predictions, with a \"try it\" console.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Browser\n    P[Drawing pad] --> Pre[MNIST-style preprocessing20×20 box, centre of mass]\n    Pre --> NN[shared/nn.jsJS runtime + float16 weights]\n    NN --> V[Live layer view]\n  end\n  Pre -- \"POST /api/drawings (pixels + label)\" --> F1[Netlify Functionre-runs the model]\n  F1 --> B[(Netlify Blobsstats, recent, daily shards)]\n  Pre -- \"POST /api/predict\" --> F2[Netlify Functionsame weights]\n  P -- \"POST /api/second-opinion (PNG)\" --> F3[Netlify Function] --> G[Gemini vision]\n  T[python/train.pyTensorFlow / Keras] -- \"export weights + model card\" --> NN\n```\n\n| Layer | Technology |\n|---|---|\n| Training | Python, TensorFlow / Keras, NumPy |\n| Inference | A 170-line JavaScript runtime (`shared/nn.js`: conv2d, max-pool, dense, softmax) running float16 weights exported from Keras. It's used by both the browser and the API, and there's no ML library in the bundle. |\n| Frontend | React 18, Vite, Framer Motion, Canvas 2D |\n| Backend | Netlify Functions (Node 22) |\n| Database | Netlify Blobs |\n| AI | Gemini API (multimodal), with a fallback chain across models and a per-IP rate limit |\n\n### Checked against TensorFlow\n\n`npm run parity` runs both exported models through the JavaScript runtime on all 10,000 MNIST test images and compares them with the Keras models:\n\n| Model | Same digit as TensorFlow | TF accuracy | JS accuracy | Max probability gap | JS speed |\n|---|---|---|---|---|---|\n| Dense | 100.00% | 97.62% | 97.62% | 0.0006 | 0.1 ms / image |\n| CNN | 100.00% | 99.31% | 99.31% | 0.0016 | 1.5 ms / image |\n\n## API\n\n| Method | Path | Description |\n|---|---|---|\n| `POST` | `/api/predict` | `{ \"px\": \u003cbase64 of 784 bytes, or array of 784 numbers>, \"model\": \"cnn\" \\| \"dense\" }` → digit, confidence, 10 probabilities |\n| `POST` | `/api/drawings` | Save a labelled drawing `{ px, label, model }`; the server recomputes the prediction |\n| `GET` | `/api/stats` | Totals, real-drawing accuracy per model, confusion matrices, latest 48 drawings |\n| `GET` | `/api/dataset` | All saved drawings as CSV (label, model, prediction, 784 pixels) |\n| `POST` | `/api/second-opinion` | `{ image: \"data:image/png;base64,…\" }` → Gemini's digit, confidence and reasoning |\n| `GET` | `/api/health` | Status and configuration |\n\n```bash\ncurl -X POST https://glyph-nishant.netlify.app/api/predict \\\n  -H \"content-type: application/json\" \\\n  -d '{\"model\":\"cnn\",\"px\":[0,0,0, ... 784 values ...]}'\n```\n\n## Run it locally\n\n```bash\nnpm install\nnpm install -g netlify-cli\nnetlify dev                 # app + API + local Blobs at http://localhost:8888\n```\n\nOptional: put `GEMINI_API_KEY=...` in a `.env` file for the second-opinion feature.\n\nRetrain and re-verify (Python 3.10+):\n\n```bash\npip install -r python/requirements.txt\nnpm run train               # downloads MNIST if needed, trains both models, exports weights + model card\nnpm run parity              # JS runtime vs TensorFlow on the full test set\n```\n\n## Deploy (Netlify free plan)\n\n1. Push this folder to a GitHub repository named `glyph`.\n2. Netlify → **Add new project → Import an existing project → GitHub** → pick `glyph`. Build settings come from `netlify.toml`.\n3. Before deploying, add the environment variable `GEMINI_API_KEY` (mark it as a secret).\n4. Name the project `glyph-nishant`, deploy, then click **Make public**.\n\n## Project structure\n\n```\npython/train.py        train both models, export weights and public/model-card.json\npython/parity.py       JS runtime vs TensorFlow on all 10,000 test digits\nshared/nn.js           the inference runtime (browser + API)\nshared/weights/*.js    exported float16 weights\nsrc/lib/preprocess.js  strokes → MNIST-style 28×28 image\nsrc/components/        drawing pad, live network view, charts\nsrc/pages/             Draw, The models, Community, API\nnetlify/functions/     predict, drawings, stats, dataset, second-opinion, health\nnetlify/lib/           Blobs storage, Gemini client, model loader\n```\n\nDataset: MNIST by Yann LeCun, Corinna Cortes and Christopher J.C. Burges.\n\n## License\n\nMIT © Nishant Singh"},{"id":"consensusgraph","n":"ConsensusGraph","r":"consensus-graph","col":["#a78bfa","#5ad1ff"],"live":"https://consensus-graph.vercel.app","t":"Scientific contradiction detection as a living, physics-driven graph.","c":["ai","ml"],"k":"Research analysis tool","s":["Vanilla JS","Three.js","Force-directed graph","Gemini (optional key)","HTML","CSS"],"kw":["research","science","literature review","contradiction detection","knowledge graph","graph visualization","nlp","claims","papers","consensus","force directed","text analysis"],"what":"Collect research claims from papers and see where the literature agrees, contradicts or merely relates.","how":"A transparent heuristic scores each pair of claims on topic overlap, polarity and negation. Nodes are claims; edges are coloured by verdict in a force-directed layout.","special":"The pairwise verdict table is fully inspectable, so every edge in the graph can be traced to a reason.","diff":"Analysis runs offline on an explainable heuristic; an optional key lets Gemini refine the consensus summary.","arch":["Claim library","Pairwise heuristic: overlap + polarity + negation","Verdict table","Force-directed graph","Consensus summary (optional AI)"],"img":"data:image/webp;base64,UklGRjBaAABXRUJQVlA4ICRaAAAw6wGdASrAAxwCPp1MoEylpCaoI1GJ6QATiWdu+vv7vUi4VQF+b9kB4D/4HlPo3+bpq3D9NYGXkh7WH0P/quMzKKz6f7oAeYPs+izbd+YbzXvTf/ft909CDpk/7tkpPy7/Bf6f8kPgF5TfkP77/kv+X/gvI99k/nv7x/k/+P/hvdUyz9s2qb80+7X7H/F/vD8Yf7v/kfmH/hPSf5y/7f+M/wfuC/mf80/1393/dz0fdl1tnmC+2f0//q/371SPef99/iv8l7K/u/+a/4XuAfz7+3f9Ly2vCn/Mf+L2BP5p/Z/+z/qf9D+4vyu//X/A9IX6X/vP/t7iX9C/vH7Idt/0thk0u3G+MRia9TjNT4K0pyjEYmvU4zU+CtKcoxGJr1OM1PgrSnKMRia9TjNLP88Gk9Ymgee0PSXKMRiaU4PoVwglTwT59qGqgQKcGmGJWNSlJ5y52jlBgwfNvmGlYV/kkAW+Y8Ge5vWUMcPY4kkZ8noyuOT4+eDXaDThR4vOnaRWnRRavgJwpDkLPYUtot1jpk5Lu7Dde9V48PWe+ 3QK3da6i/mpM/mBaxIlrfT4U9CBBeW5HOGfBfYIvlnM4t96BXV9D4FNNvS7qOpV56PhV4WNiDJ8NM/8cvhbM+YHeNi70z8C+nlt2YpCGGUQji+8Ls4bWsgbmpQvH6kb+ZsANAFsXrrkgY1a7z2TTVkP155/8q7BZ03VYO7BAnOFJ+LRLbQA9HAADHkAAAAVWDcpRBQxR4JSyKvoCbhETPEAAAA=","files":13,"loc":496,"langs":[["JavaScript",229],["CSS",208],["HTML",59]],"tree":"analysis.html\napp.css\napp.js\nBUILD_LOG.md\nclaims.html\ncore.css\ncore.js\ngraph.html\nindex.html\nPLAN.md\nREADME.md\nsettings.html\nthree.min.js","date":"2026-11-06","readme":"# ConsensusGraph\n\n**Scientific contradiction detection — in your browser.**\n\nCollect research claims from papers and sources, and see where the literature agrees, contradicts, or merely relates — as a living, physics-driven graph. Analysis runs offline with a transparent heuristic (topic overlap + polarity + negation); an optional free Gemini key refines verdicts and summaries. Nothing is uploaded.\n\n## Pages\n- **Home** (`index.html`) — landing with a live 3D knowledge-graph hero.\n- **Claims** (`claims.html`) — build a claim library (text + source); add/remove; load a curated sample set.\n- **Graph** (`graph.html`) — interactive force-directed graph; nodes are claims, edges colored by verdict (agree / conflict / related); hover to read; live consensus stats.\n- **Analysis** (`analysis.html`) — transparent pairwise verdict table + a consensus summary (optionally AI-refined).\n- **Settings** (`settings.html`) — theme, accent, Gemini key, export.\n\n## Highlights (50+ features)\nClaim library with sources, sample corpora, topic-overlap detection (Jaccard), polarity analysis, negation handling, pairwise verdicts (support/contradict/related), relevance score, consensus percentage, conflict count, interactive force-directed graph with physics layout, node hover tooltips, verdict-colored edges, analysis table sorted by verdict, AI-refined summary (Gemini), JSON export/import, 3D knowledge-graph hero (Three.js), custom cursor, ambient motion, scroll reveals, shortcuts, autosave, offline-first, responsive.\n\n## How detection works\nTwo claims are compared only if their keyword sets overlap (Jaccard ≥ 14%). Each claim gets a polarity from an increase/decrease lexicon, flipped by negation. Opposite polarity on a shared topic → **contradict**; same polarity → **support**; otherwise **related**. It's a transparent heuristic you can read — the Gemini option adds LLM judgment on top.\n\n## Deploy (free)\nStatic site, no build. Upload the folder to GitHub → Netlify/Vercel. Local: `python3 -m http.server`.\n\n## Tech\nVanilla HTML/CSS/JS + Three.js (bundled locally). Fonts: Spectral, Space Grotesk, IBM Plex Mono.","top":3},{"id":"driftwatch","n":"DriftWatch","r":"drift-watch","col":["#2ee6c5","#0f172a"],"live":"https://drift-watch-ruddy.vercel.app","t":"Know when your model rots: data-drift monitoring with real statistics.","c":["ml"],"k":"MLOps monitoring","s":["Vanilla JS","Three.js","PSI","Kolmogorov–Smirnov","Canvas charts","HTML","CSS"],"kw":["mlops","model monitoring","data drift","concept drift","psi","ks test","statistics","machine learning","observability","alerts","monitoring system","dashboard","data science"],"what":"Measures how far live data has moved from training data per feature, tracks performance decay and raises alerts at a threshold you control.","how":"Population Stability Index and Kolmogorov–Smirnov distance are computed on-device for each feature, with 30-day drift history and a baseline-versus-current distribution view.","special":"Drag the PSI threshold and alerts recompute live across every model and feature.","diff":"The statistics are real implementations, not mocked numbers, and run with no backend.","arch":["Baseline vs live samples","PSI + KS per feature","Drift history (30 days)","Alert threshold","Monitors ranked by drift"],"img":"data:image/webp;base64,UklGRr5xAABXRUJQVlA4ILJxAACQ8gGdASrAAxwCPp1KoEwlpCatJLTpgaATiWdu4V/fCHBzCiPOSicUUr9PxPQDuL+s9Nn93/o/PbsPzHOY/+Z6F/Vv+hf+57gH7Cfr31tfMP+3f7Z+69/w/2x90v9O/237CfAL/PvSV/7vsT+gB+2v ery model and feature, with severity.\n- **Playground** — shift a distribution's mean and variance and watch PSI & KS move in real time. This is the exact math behind every monitor.\n- **Settings** — theme, accents, private JSON export.\n\n## The statistics are real\n- **PSI** (`psi()`) bins baseline vs current into a shared range and sums `(aᵢ−eᵢ)·ln(aᵢ/eᵢ)` — the standard drift index (`\u003c0.1` stable, `0.1–0.25` warning, `≥0.25` drift).\n- **KS** (`ksStat()`) is the max gap between the two empirical CDFs.\n- Model/feature data is generated from seeded Gaussians (`mulberry32` + Box–Muller) so numbers are stable across reloads, then PSI/KS are computed live from the samples — nothing is hard-coded.\n\n## Deploy\nStatic site — drop the folder on Netlify (app.netlify.com/drop), `vercel`, or GitHub Pages. No env vars.\n\n## Feature count\n50+ — monitoring, PSI, KS, per-feature breakdown, drift history, decay tracking, volume trends, threshold alerting, a live playground, charts, 3D hero, theming, export, full offline. Full list on the home page.\n\n*The real market need: silent model degradation is the #1 production-ML failure mode (cf. Arize, Fiddler, WhyLabs). DriftWatch is a self-contained, offline demonstration of how you catch it.*","top":4},{"id":"lineageiq","n":"LineageIQ","r":"lineage-iq","col":["#5b8cff","#7c5cff"],"live":"https://lineage-iq.vercel.app","t":"Trust your data: lineage, freshness and blast radius for every table.","c":["ml","mgmt"],"k":"Data observability","s":["Vanilla JS","Three.js","DAG rendering","BFS traversal","HTML","CSS"],"kw":["data lineage","data engineering","data catalog","data quality","data observability","dbt","dag","pipeline","impact analysis","blast radius","incidents","freshness","sla","data management system","analytics engineering"],"what":"Maps every table from raw ingest to BI dashboard, tracks freshness and tests, detects incidents and traces the blast radius of any change.","how":"Assets across four layers form a graph. .\n- `downstream()` / `upstream()` are real BFS traversals.\n- **Health propagates**: `healthDeep()` marks an asset unhealthy if it or anything upstream has a failing test or breached SLA — so a bad raw table lights up everything it feeds.\n- Incidents are derived from the actual tests and freshness values, then sorted by blast radius.\n- The lineage graph on each asset is laid out by distance-from-focus and drawn with bezier SVG edges.\n\n## Deploy\nStatic — Netlify drop, `vercel`, or GitHub Pages.\n\n## Feature count\n50+ — lineage graph, 15 assets, 4 layers, column tests, freshness SLAs, health propagation, incident feed, impact/blast-radius analysis, 3D hero, theming, export, offline. Full list on the home page.\n\n*The real market need: broken dashboards and silent pipeline failures with no way to trace cause or impact (cf. Monte Carlo, Datafold, dbt). LineageIQ is a self-contained demonstration of data lineage + observability.*","top":5},{"id":"churnlens","n":"ChurnLens","r":"churn-lens","col":["#ff5370","#ff9068"],"live":"https://churn-lens-lake.vercel.app","t":"Keep the revenue you already have: explainable churn risk and a retention simulator.","c":["ml","mgmt"],"k":"Customer analytics","s":["Vanilla JS","Three.js","Logistic risk model","Cohort analysis","Canvas charts"],"kw":["churn prediction","customer retention","saas metrics","cohort analysis","risk scoring","explainable","crm","customer success","customer management","revenue","mrr","simulator","what-if","data science","machine learning"],"what":"Scores every account with a risk model, explains why each is at risk, maps retention cohorts and simulates retention levers.","how":"Each of 40 accounts is scored from its features; a drawer lists the factors and the recommended play. A retention triangle shows percent retained by cohort and month.","special":"The simulator's four levers each change a feature the model actually uses and re-score all accounts live, showing accounts saved and revenue retained." curves.\n- **Segments** — where churn concentrates: average risk and MRR-at-risk by plan and by region.\n- **Simulator** — four retention levers (engagement, price, NPS, proactive support), each changing a feature the model actually uses; it **re-scores all 40 accounts live** and shows accounts saved, annual revenue retained, and a before/after retention curve.\n- **Settings** — theme, accents, JSON export.\n\n## The model is real\nA logistic churn model (`churnProb`) over six features — tenure, engagement, support friction, NPS, price sensitivity and plan tier — each with a signed weight. Risk is `sigmoid(w·features)`. The customer drawer decomposes the score into **per-factor contributions** (a SHAP-style explanation), and the simulator recomputes the whole book by adjusting features and re-running the same model — so the revenue numbers move for a real reason.\n\n## Deploy\nStatic — Netlify drop, `vercel`, or GitHub Pages.\n\n## Feature count\n50+ — risk scoring, explainable factors, risk bands, cohort retention triangle, survival curves, segment analysis, MRR at risk, what-if simulator with live re-scoring, revenue impact, 3D hero, theming, export, offline. Full list on the home page.\n\n*The real market need: SaaS teams react to churn instead of predicting it (cf. retention/CS tooling). ChurnLens is a self-contained demonstration of predictive churn + retention simulation.*","top":6},{"id":"tf-digits","n":"TensorFlow Digit Classifier","r":"tensorflow-digit-classifier","col":["#ff6f00","#425066"],"live":"","t":"The original notebook: a CNN that reads handwritten digits.","c":["ml"],"k":"Notebook","s":["Python","TensorFlow","Keras","Jupyter","Google Colab","MNIST"],"kw":["deep learning","cnn","mnist","tensorflow","keras","notebook","computer vision","image classification","python","machine learning","digit recognition"],"what":"A Colab notebook that trains a neural network on MNIST to recognize digits 0 to 9.","how":"Loads MNIST, normalizes the images, trains a Keras model and evaluates it on the held-out test set.","special":"The starting point that later grew into Glyph.","diff":"Kept as the honest first version: one notebook, no app.","arch":["MNIST dataset","Normalize","Keras model","Train","Evaluate"],"img":"","files":2,"loc":134,"langs":[["Jupyter",134]],"tree":"README.md\ntrain_model.ipynb","date":"2026-01-19","readme":"# TensorFlow Digit Classifier 🧠🔢\n\nA Deep Learning project that identifies handwritten digits using a Convolutional Neural Network (CNN) architecture built with **TensorFlow** and **Keras**.\n\n## 🚀 Overview\nThis project uses the classic MNIST dataset to train a neural network to recognize digits (0-9). It serves as a foundational project in Computer Vision and Deep Learning.\n\n## 🛠️ Tech Stack\n* **Language:** Python\n* **Library:** TensorFlow / Keras\n* **Data:** MNIST Dataset\n* **Environment:** Google Colab\n\n## 📊 Performance\n* **Training Accuracy:** ~98%\n* **Test Accuracy:** ~97.5%\n* **Optimizer:** Adam\n* **Loss Function:** Sparse Categorical Crossentropy\n\n## 📁 Project Structure\n* `train_model.ipynb`: The Google Colab notebook containing the training logic.\n* `digit_model.h5`: The saved, trained model ready for deployment.\n\n## 💡 Key Learnings\n- Normalizing image data for faster neural network convergence.\n- Implementing Dropout layers to reduce overfitting.\n- Saving and exporting models for future inference (API/Web use).","top":7},{"id":"privacyprism","n":"Privacy Prism","r":"Privacy-Prism","col":["#a855f7","#06b6d4"],"live":"https://privacy-prism-alpha.vercel.app","t":"A browser-only lab for checking whether synthetic data is safe and useful to release.","c":["ml","sys"],"k":"Data privacy tool","s":["Vanilla JS","Statistics (KS, TVD, Pearson)","CSV parsing","HTML","CSS"],"kw":["privacy","synthetic data","data privacy","anonymization","statistics","ks test","data quality","fidelity","utility","re-identification","csv","data science","compliance","governance"],"what":"Compares an original CSV with a synthetic CSV and turns the results into readable evidence for a human release review.","how":"Numeric fields get a two-sample empirical CDF distance and mean movement; categories get total variation distance. A nearest-row screen compares up to 250 rows each way for exact overlaps and similarity.","special":"Ten extra checks include schema alignment, missingness fidelity, relationship drift across correlations and range validity.","diff":"Sensitive data never leaves the browser, which is the only sensible way to test data you are not yet allowed to share.","arch":["Source CSV + synthetic CSV","Schema alignment","Distribution tests (KS · TVD)","Nearest-row similarity screen","Release-readiness report"],"img":"data:image/webp;base64,UklGRphsAABXRUJQVlA4IIxsAADw5QGdASrAAxwCPp1KoEylpCo2JBJZysATiWdu/B/HDhp+IDisUGpTpPf69hu+hzi/m0rh510B+hfZz/x/WD+tv+t7gX68frH7jv+p6zf7z/2vUN/Tf+J623+Q/aX3ff5T/K+wB/VP9V//+wU9Bb9uvTn9l7+6f+n0k///2fPSj9e/8f/fvXb8Z/b/8n/dP8T/zv8H6n/jH0v+J/uP7lewfnv9R/u/NL+WfeP+J/e/3k9c/+Z/ZfGH85/dP+//j/YF/Jf5z/vf756x31H7S923rP/A/9H+v9gX2k+wf9f/HeLV/c/5n1H/VP8F/0/8l8AH85/s3/J/xvuD/vP2T8jf75/vf+7/sfgB/nX9k/6n+O/MD6ZP7L/7/7Lz+/pP+y/+v+7+Ar+f/4Drk+lCP+Nb5K1VVVVVVVVVVVVVVVVVVVVVVVVVVVRo6G/Tc3IeVH+gsJavwnWHk5gpljZCgY7An/BXvz01TB+MvbtmPVHo10D/t1xWKwY2BFgx81WQIOrgNFnMM1AT6QJEnlJxX0rUK64J/eAUj7CKxmZmZmZmZmZmElWUKjmC9GJNxP7qHzYwC9cZX+Uhyspmx2xWupVGxPTeYVsYsmTS4aiq9X14cOvMLT8Mc644oz7jtI9KLVrysvIHmSUmB48xnD+5QMOrDg0qX6l1yPVvNIHna1aGwpbejltKwmrLhSGSszGmqsxshYlCQM+vjcMH1nF71nKMHsWlBx/9yKzAC9xA55dQ66JkNDU1W8ylbryY7naF4ekTOBcWqqqqqqqqqqqqqqqqqqqqqqqqqqqqqsIuvy8yPqaSfujZeQSnd3fUon3vq4o6hCIsReg7bxLl79RKY0W1PJ8Vznems1Hay7aFe+g5pQcYsxZcKcpn+TrlxtyNGZmZmZmZmZmZmZmZmZmZl50DLbZDMhDFpwkTf2maYpqRVJuIUHat3Inbdx2h7ahsv6CStVUQ2OsXd3d3d3d3d3d1xtWvGzqhban2JHl9YQLvG2Veb7nDpvMGcLF450NYazK6S9YWEWc9DShZhC60ydcWZHNvx8NLb0zZPEmrktXBWI3b4br6M2Zt9h9B52LZjppmnJENiaQ0Lh5oQc75aRCNDeFONEJGSS/2EigdvKB6Pcozl5iFIltingZfujOqGaLzsphHSQ25piGpI/iLqdcG6KQR8bVKbq3WFkFXqUQN+9ulbCOKTVlVROPR0 readme":"# Privacy Prism\n\nPrivacy Prism is a free, browser-only synthetic-data release-readiness lab. It compares an original/reference CSV with a synthetic CSV and turns the results into readable evidence for a human review. The selected visual direction is the dark **Privacy Prism** concept: graphite panels, large readable typography, a sharply faceted vector crystal, animated light dispersion, and pointer-responsive tilt.\n\n## Start\n\nOpen `index.html` directly, or serve this folder locally:\n\n```sh\npython3 -m http.server 8000\n```\n\nVisit `http://localhost:8000`. No build step, package installation, account, API key, or paid service is required. Google Fonts improve the visual match; the design falls back to system fonts if they are unavailable.\n\n## Deploy on Vercel\n\n1. Upload the contents of this folder to the root of a GitHub repository.\n2. Import the repository in Vercel.\n3. Choose **Other** as the framework preset, leave the build command empty, and set the output directory to `.`.\n4. Deploy.\n\n## Preserved core features\n\n- **Utility and fidelity:** compare numeric distributions with a two-sample empirical CDF distance plus standardized mean movement; compare categories with total variation distance.\n- **Nearest-row similarity screen:** compare up to 250 synthetic rows against up to 250 source rows using normalized, shared non-identifier fields; report exact overlaps and mean nearest-row similarity.\n- **Group coverage:** compare proportions for one selected categorical field and inspect missing categories.\n\n## Ten added checks and workflows\n\n1. **Schema alignment:** find source-only and synthetic-only columns.\n2. **Missingness fidelity:** compare per-field null rates.\n3. **Distribution-shape screen:** report KS distance for numeric fields and total variation distance for categories.\n4. **Relationship drift:** compare pairwise Pearson correlations for numeric feature pairs.\n5. **Range and category validity:** identify numeric values outside the source range and categories not observed in the source.\n6. **Record integrity:** count duplicate rows in both datasets.\n7. **Attribute-inference scenario:** choose known fields and a sensitive field to see whether synthetic groups can help predict source values, with a majority baseline.\n8. **Intersectional coverage:** compare two-field combinations to find source combinations absent from synthetic data.\n9. **Downstream model utility proxy:** compare a simple 1-nearest-neighbor classifier trained on source versus synthetic rows, evaluated on held-out source rows.\n10. **User-defined release gate and evidence pack:** set thresholds, see PASS / REVIEW / HOLD flags, and download aggregate JSON evidence.\n\nEvery analysis control is functional in the browser. The included customer-style demo data is fabricated for interface exploration and contains no real people.\n\n## Privacy and interpretation\n\nCSV files are parsed in browser memory. The app does not send rows to a server or include rows in the JSON evidence export. It does not save uploaded data in local storage; closing the tab clears it. The optional theme preference is stored locally.\n\nThese are exploratory screens, not a certification, legal assessment, differential-privacy guarantee, or proof against re-identification. Nearest-neighbor similarity is not a probability of disclosure. The inference and model checks are deliberately simple and can be unstable on small data. Range validity can flag legitimate generated tail values. A passing user-defined gate is not evidence that data is safe to publish. Review the in-app **Method & limitations** page and get an appropriate privacy/security review before releasing sensitive data.\n\n## Product position\n\nThe problem is real and active: teams need an understandable release review that examines utility, similarity risk signals, missingness, relationships, and subgroup blind spots together. This project should be presented as a distinctive local-first workflow and visual product experience—not as a claim that synthetic-data evaluation is a wholly untouched research area."}],"totalLoc":9851,"locked":true}</script>

/* ---------- markdown (README) ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,function(m,c){return '<code>'+c+'</code>'});
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  return s.replace(/&amp;nbsp;/g,' ');
}
function md(src){
  var L=src.split('\n'),o=[],i=0,first=true,para=[];
  function flush(){if(para.length){o.push('<p>'+inline(para.join(' '))+'</p>');para=[]}}
  while(i<L.length){var l=L[i];
    if(/^\s*```/.test(l)){flush();var code=[];i++;while(i<L.length&&!/^\s*```/.test(L[i])){code.push(L[i]);i++}i++;o.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}
    var h=l.match(/^(#{1,6})\s+(.*)/);if(h){flush();if(first&&h[1].length===1){first=false;i++;continue}first=false;o.push('<h'+(h[1].length<=2?3:4)+'>'+inline(h[2].replace(/#+\s*$/,''))+'</h'+(h[1].length<=2?3:4)+'>');i++;continue}
    if(/^\s*\|/.test(l)){flush();var rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}var t='<div class="tw"><table>';rows.forEach(function(r,n){if(/^\s*\|[\s:\-|]+\|?\s*$/.test(r))return;var cells=r.trim().replace(/^\||\|$/g,'').split('|');t+='<tr>'+cells.map(function(c){return (n===0?'<th>':'<td>')+inline(c.trim())+(n===0?'</th>':'</td>')}).join('')+'</tr>'});o.push(t+'</table></div>');continue}
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){flush();var ord=/^\s*\d+\./.test(l),items=[];while(i<L.length&&(/^\s*([-*+]|\d+\.)\s+/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&items.length))){if(/^\s*([-*+]|\d+\.)\s+/.test(L[i]))items.push(L[i].replace(/^\s*([-*+]|\d+\.)\s+/,''));else items[items.length-1]+=' '+L[i].trim();i++}o.push((ord?'<ol>':'<ul>')+items.map(function(x){return '<li>'+inline(x)+'</li>'}).join('')+(ord?'</ol>':'</ul>'));continue}
    if(/^\s*>/.test(l)){flush();var bq=[];while(i<L.length&&/^\s*>/.test(L[i])){bq.push(L[i].replace(/^\s*>\s?/,''));i++}o.push('<blockquote>'+inline(bq.join(' '))+'</blockquote>');continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)||!l.trim()){flush();i++;continue}
    para.push(l.trim());i++}
  flush();return o.join('');
}

/* ---------- tailored landing views from the URL: ?role=ai-engineer&tech=react,typescript&tag=rag ---------- */
var ROLES=[
 ['ai-engineer','AI Engineer',['ai','aiengineer','genai','llm','llmengineer','aiml','agent','agents','aiagent'],{cats:['ai'],q:['ai agent','llm','rag','prompt']}],
 ['ml-engineer','ML Engineer',['ml','mlengineer','mle','machinelearning','datascientist','datascience','ds'],{cats:['ml'],q:['machine learning','mlops','deep learning']}],
 ['data-engineer','Data Engineer',['data','dataengineer','de','analyticsengineer'],{q:['data engineering','stream processing','data lineage','data quality','etl','data integration']}],
 ['full-stack','Full-stack',['fullstack','sde','swe','softwareengineer','software','developer','webdeveloper'],{q:['full stack'],techAll:[/^React/,/Functions|Supabase/]}],
 ['backend','Backend',['backend','backendengineer','api','systems','distributed'],{cats:['sys'],q:['backend','rest api','distributed systems','webhook','database']}],
 ['frontend','Frontend',['frontend','frontendengineer','ui','web','creative'],{q:['3d visualization','web design','scroll animation'],techAny:[/^React/,/Three\.js|WebGL|GSAP|Framer|MapLibre/]}],
 ['security','Security',['security','securityengineer','appsec','cybersecurity','infosec'],{q:['security','privacy','authentication','red team']}],
 ['forward-deployed','Forward Deployed',['fde','forwarddeployed','forwarddeployedengineer','solutions','solutionsengineer','enterprise'],{cats:['mgmt'],q:['enterprise','integration','ai agent','management system']}]
];
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function findRole(v){var s=slug(v);if(!s)return null;for(var i=0;i<ROLES.length;i++){if(slug(ROLES[i][0])===s||slug(ROLES[i][1])===s||ROLES[i][2].indexOf(s)>-1)return ROLES[i]}return null}
function addScores(map,list,bonus){list.forEach(function(o){var p=o.p||o;map[p.id]=(map[p.id]||0)+(o.score||0)+(bonus||0)})}
function computeView(){
  var sets=[],labels=[],S=VSTATE;
  if(S.role){var r=findRole(S.role),m={};
    if(r){var d=r[3];if(d.cats)addScores(m,P.filter(function(p){return d.cats.indexOf(p.c[0])>-1}),60),addScores(m,P.filter(function(p){return d.cats.indexOf(p.c[0])<0&&p.c.some(function(c){return d.cats.indexOf(c)>-1})}),25);
      (d.q||[]).forEach(function(q){addScores(m,runSearch(q))});
      if(d.techAll)addScores(m,P.filter(function(p){return d.techAll.every(function(re){return has(p,re)})}),70);
      if(d.techAny)addScores(m,P.filter(function(p){return d.techAny.some(function(re){return has(p,re)})}),45);
      labels.push(r[1]+' roles')}
    else{addScores(m,runSearch(String(S.role).replace(/[-_+]/g,' ')));labels.push('“'+String(S.role).replace(/[-_+]/g,' ')+'”')}
    sets.push(m)}
  if(S.tech){var terms=String(S.tech).split(/[,|]/).map(function(x){return norm(x).replace(/[.\-\s]/g,'')}).filter(Boolean),m2={};
    var hasT=function(p,t){return p.s.some(function(x){return norm(x).replace(/[.\-\s]/g,'').indexOf(t)>-1})};
    var all=P.filter(function(p){return terms.every(function(t){return hasT(p,t)})});if(!all.length)all=P.filter(function(p){return terms.some(function(t){return hasT(p,t)})});
    addScores(m2,all,40);sets.push(m2);labels.push(String(S.tech).split(/[,|]/).map(function(x){return x.trim()}).filter(Boolean).join(' + '))}
  if(S.tag){var m3={};addScores(m3,runSearch(String(S.tag).replace(/[-_+]/g,' ')));sets.push(m3);labels.push('“'+String(S.tag).replace(/[-_+]/g,' ')+'”')}
  if(!sets.length){VIEW=P;TOP=ALLTOP;VLABEL='';return}
  var list=P.filter(function(p){return sets.every(function(m){return m[p.id]})}).map(function(p){var sc=0;sets.forEach(function(m){sc+=m[p.id]});return {p:p,sc:sc+(p.top?44-p.top*3:0)}}).sort(function(a,b){return b.sc-a.sc}).map(function(o){return o.p});
  if(!list.length){VIEW=P;TOP=ALLTOP;VLABEL='';VSTATE.none=labels.join(' · ');return}
  VIEW=list;TOP=list.slice(0,8);VLABEL=labels.join(' · ');
}

  else if(VSTATE.none)h+='<p class="vb-note">Nothing matched '+esc(VSTATE.none)+', so everything is shown.</p>';
